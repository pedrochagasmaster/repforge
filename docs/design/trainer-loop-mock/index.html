<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taurifer Trainer Loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
@font-face{font-family:"Plex Sans";src:url(../../../fonts/plexsans.woff2) format("woff2");font-weight:100 700;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(../../../fonts/plexmono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(../../../fonts/plexmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
/*END-FONTS*/
/* Layout: two phones side by side on a desk (trainer left, client right) under one guide strip; at phone width a single screen fills the page and follows whoever acts next. Mock-only; values mirror styles.css tokens (DESIGN.md). */
:root{
  --bg:#F4F2EF;--surface:#FFFFFF;--well:#FAF8F5;--ink:#1B1A17;--ink-soft:#6A665F;--ink-faint:#716D66;
  --rule:#E4E1DA;--rule-strong:#D9D5CD;--accent:#E04E14;--accent-deep:#B8410E;--accent-ink:#FFFFFF;
  --cta:#161513;--cta-ink:#FFFFFF;--positive:#2F7D33;--danger:#C93A2B;--scrim:rgba(27,26,23,.42);
  --dock-glass:rgba(250,248,245,.72);--dock-pill:#FFFFFF;--desk:#E7E3DC;--bezel:#161513;
  --shadow:0 18px 50px rgba(27,26,23,.18);--qr-bg:#FFFFFF;--qr-fg:#161513;
  --sans:"Plex Sans","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Plex Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141310;--surface:#1E1C18;--well:#191713;--ink:#F2EFE9;--ink-soft:#ADA79D;--ink-faint:#99938A;
  --rule:#2E2B26;--rule-strong:#4A453D;--accent:#F2703B;--accent-deep:#FF8A3D;--accent-ink:#231A14;
  --cta:#F2EFE9;--cta-ink:#161513;--positive:#63C267;--danger:#FF6670;--scrim:rgba(0,0,0,.62);
  --dock-glass:rgba(30,28,24,.78);--dock-pill:#3A3733;--desk:#0B0A08;--bezel:#35312B;
  --shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141310;--surface:#1E1C18;--well:#191713;--ink:#F2EFE9;--ink-soft:#ADA79D;--ink-faint:#99938A;
  --rule:#2E2B26;--rule-strong:#4A453D;--accent:#F2703B;--accent-deep:#FF8A3D;--accent-ink:#231A14;
  --cta:#F2EFE9;--cta-ink:#161513;--positive:#63C267;--danger:#FF6670;--scrim:rgba(0,0,0,.62);
  --dock-glass:rgba(30,28,24,.78);--dock-pill:#3A3733;--desk:#0B0A08;--bezel:#35312B;
  --shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* demo chrome */
.app{height:100%;display:flex;flex-direction:column}
.chrome{flex:none;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px var(--gr) 12px var(--gl);display:grid;gap:10px}
.chrome__row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--ink-soft);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:999px;padding:2px;background:var(--well)}
.seg button{min-height:32px;padding:0 12px;border-radius:999px;font-size:.8125rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--rule-strong);font-size:.8125rem}
.guide{display:flex;gap:12px;align-items:center}
.guide__n{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);white-space:nowrap}
.guide__t{flex:1;min-width:0;margin:0;font-size:.9375rem;text-wrap:pretty}
.guide__t b{font-weight:600}
.guide .btn{flex:none;width:auto;min-height:40px;padding:0 16px;font-size:.875rem}
.who{display:none}

.desk{flex:1;min-height:0;display:flex;justify-content:center;gap:40px;padding:0}
.slot{display:flex;flex-direction:column;min-height:0;flex:1;min-width:0}
.slot[hidden]{display:none}
.slot__label{display:none}
.phone{position:relative;flex:1;min-height:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px var(--gr) 28px var(--gl)}
.screen.has-dock{padding-bottom:104px}
.screen.has-bar{padding-bottom:20px}

@media (min-width:900px){
  .chrome{padding-inline:max(24px,var(--gl)) max(24px,var(--gr))}
  .who{display:none}
  .desk{align-items:center;padding:20px 24px}
  .slot{flex:none;width:390px;height:100%;max-height:800px}
  .slot[hidden]{display:flex}
  .slot__label{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--ink-soft);padding:0 6px 10px}
  .slot__label b{color:var(--ink);font-weight:600}
  .turn{margin-left:auto;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep);font-weight:600}
  .phone{border-radius:34px;box-shadow:0 0 0 8px var(--bezel),var(--shadow);transition:opacity .25s}
  .slot:not(.is-turn) .phone{opacity:.62}
  .screen{padding-inline:16px}
}
@media (max-width:899px){.who{display:inline-flex;margin-right:auto}.brand{display:none}.chrome{gap:8px;padding-top:8px}}

/* type */
.eyebrow{font-size:.6875rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0}
.crumb{color:var(--ink-soft);font-size:.875rem;margin:0}
h1{font-size:1.875rem;line-height:1.12;letter-spacing:-.02em;font-weight:600;margin:4px 0 4px;text-wrap:balance}
h2{font-size:1.25rem;line-height:1.2;letter-spacing:-.01em;font-weight:600;margin:0}
.sub{color:var(--ink-soft);margin:0}
.small{font-size:.875rem;color:var(--ink-soft);margin:0}
.sec{margin-top:26px}
.sec>.eyebrow{padding-bottom:10px;border-bottom:1px solid var(--rule)}

/* bars and buttons */
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:-6px 0 6px}
.link{color:var(--accent-deep);font-weight:500;min-height:44px;display:inline-flex;align-items:center;gap:2px}
.link svg{margin-left:-6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:999px;font-weight:600;padding:0 20px;text-align:center}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.secondary{border:1px solid var(--ink-soft)}
.btn[aria-disabled="true"]{opacity:.38}
.actionbar{flex:none;background:var(--bg);border-top:1px solid var(--rule);padding:12px var(--gr) 14px var(--gl);display:grid;gap:10px}
.actionbar .small{text-align:center}
.float-cta{position:absolute;left:var(--gl);right:var(--gr);bottom:92px;z-index:2}
.float-cta .btn{box-shadow:0 8px 22px rgba(0,0,0,.2)}

/* rows */
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;border-bottom:1px solid var(--rule);width:100%}
.row__main{flex:1;min-width:0}
.row__t{display:block;font-weight:500}
.row__s{display:block;font-size:.875rem;color:var(--ink-soft)}
.row__s.warn{color:var(--accent-deep)}
.chev{color:var(--ink-faint)}
.badge{flex:none;font-size:.6875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 9px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--rule-strong);display:grid;place-items:center;font-size:.8125rem;font-weight:600;color:var(--ink-soft)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-faint)}
.radio.on{border:7px solid var(--ink)}
.field{display:grid;gap:6px;margin-top:18px}
.field label{font-size:.8125rem;color:var(--ink-soft)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--rule-strong);border-radius:12px;padding:13px 14px;width:100%;resize:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 12px;min-height:44px;color:var(--ink-faint);margin-top:16px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.6875rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:right;padding:10px 0;border-bottom:1px solid var(--rule)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:13px 0;border-bottom:1px solid var(--rule);text-align:right;vertical-align:baseline}
.tbl td:first-child{padding-right:10px}
.tbl .kg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.125rem;white-space:nowrap}
.tbl .tg{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;padding-left:14px}
.tbl .from{color:var(--ink-faint);font-size:.9375rem}
.up{color:var(--accent)}
.flat{color:var(--ink-faint)}
.tag{display:inline-block;font-size:.6875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-deep);margin-left:6px;white-space:nowrap}
.strike{text-decoration:line-through;color:var(--ink-faint)}

/* today */
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 0}
.segs i{height:3px;border-radius:2px;background:var(--rule-strong)}
.segs i.done{background:var(--ink-soft)}
.segs i.now{background:var(--accent)}
.by{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink-soft);margin:14px 0 0;padding:12px 0;border-block:1px solid var(--rule)}
.nudge{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}

/* attendance */
.att{display:grid;grid-template-columns:auto repeat(4,1fr) auto;gap:8px 8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.att .h{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.att .w{font-family:var(--mono);font-size:.8125rem;color:var(--ink-soft)}
.att .c{height:26px;border-radius:6px;background:var(--ink)}
.att .c.miss{background:none;border:1.5px dashed var(--accent)}
.att .n{font-family:var(--mono);font-size:.8125rem;color:var(--ink-soft);text-align:right}
.flag{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.flag__dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.quote{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--rule-strong);color:var(--ink-soft);font-size:.9375rem}
.status{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);font-size:.875rem}
.status svg{color:var(--positive)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0 4px;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule-strong);font-size:.875rem;color:var(--ink-soft)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* handoff */
.qr{background:var(--qr-bg);color:var(--qr-fg);border-radius:16px;padding:18px;width:min(240px,70%);margin:22px auto 14px;border:1px solid var(--rule)}
.qr svg{width:100%;height:auto}
.center{text-align:center}
.idle{flex:1;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:24px;color:var(--ink-soft)}
.idle svg{color:var(--ink-faint)}
.gatecard{margin-top:22px;border-radius:16px;background:var(--surface);border:1px solid var(--rule);padding:4px 16px}
.gatecard .row:last-child{border-bottom:0}
.diff{padding:14px 0;border-bottom:1px solid var(--rule)}
.diff .eyebrow{margin-bottom:4px}

/* dock */
.dock{position:absolute;left:14px;right:14px;bottom:12px;z-index:3;display:flex;padding:5px;border-radius:999px;background:var(--dock-glass);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px var(--rule-strong)}
.dock button{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:.6875rem;font-weight:500;color:var(--ink-soft)}
.dock button[aria-current="page"]{background:var(--dock-pill);color:var(--accent-deep);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:16px 16px 0 0;padding:10px var(--gr) 16px var(--gl);max-height:88%;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet__grab{width:38px;height:5px;border-radius:3px;background:var(--rule-strong);margin:0 auto 10px}
.sheet__head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.close{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.list2{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:.9375rem}
.list2 li{display:flex;gap:10px;align-items:flex-start}
.list2 svg{margin-top:3px;color:var(--positive)}
.list2.no svg{color:var(--ink-faint)}
.list2.no{color:var(--ink-soft)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);font-size:.8125rem;padding:9px 14px;border-radius:999px;white-space:nowrap;pointer-events:none}

/* guide target */
.hint{position:relative;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);animation:pulse 1.5s ease-in-out infinite}
.row.hint,.nudge.hint{border-radius:10px}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 8px color-mix(in srgb,var(--accent) 35%,transparent)}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.hint,.sheet{animation:none}.phone{transition:none}}
</style>
</head><body>
<div class="app">
  <div class="chrome">
    <div class="chrome__row">
      <span class="brand">Taurifer <span id="brandSub"></span></span>
      <span class="seg who" id="who"></span>
      <span class="seg" id="lang"><button data-act="lang" data-v="en">EN</button><button data-act="lang" data-v="pt">PT</button></span>
      <button class="ghost" data-act="restart" id="restart"></button>
    </div>
    <div class="guide" id="guide"></div>
  </div>
  <div class="desk">
    <div class="slot" data-slot="trainer"><div class="slot__label" id="lblTrainer"></div><div class="phone" data-who="trainer"></div></div>
    <div class="slot" data-slot="client"><div class="slot__label" id="lblClient"></div><div class="phone" data-who="client"></div></div>
  </div>
</div>

function qr(){ // decorative code, not scannable
  let s=20261125,n=25,out="";const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const finder=(x,y)=>x<7&&y<7||x>n-8&&y<7||x<7&&y>n-8;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;if(finder(x,y)){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);on=fx===0||fx===6||fy===0||fy===6||(fx>1&&fx<5&&fy>1&&fy<5)}
    else if((x===7&&y<8)||(y===7&&x<8)||(x===n-8&&y<8)||(y===7&&x>n-9)||(x===7&&y>n-9)||(y===n-8&&x<8))on=false;else on=r()>.52;
    if(on)out+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02"/>'}
  return '<svg viewBox="0 0 25 25" fill="currentColor" role="img" aria-label="QR">'+out+"</svg>"}

    '<p class="eyebrow" style="margin-top:18px">'+t("stays")+'</p><ul class="list2 no"><li>'+I.dash+"<span>"+t("st1")+"</span></li><li>"+I.dash+"<span>"+t("st2")+"</span></li></ul>"+
    '<div class="field"><label for="cmsg">'+t("msg")+'</label><input id="cmsg" autocomplete="off"></div>'+
    '<div style="display:grid;gap:10px;margin-top:16px"><button class="btn primary" data-act="send">'+t("send")+'</button><p class="small center">'+t("sendFoot")+"</p></div></div>";
  return h}
function updateGate(){
  return '<div class="screen has-bar" style="padding-top:34px"><p class="eyebrow">'+t("updEy")+'</p><h1 style="margin-top:10px">'+t("updH")+"</h1>"+
    '<div class="gatecard" style="padding-block:2px"><div class="diff"><p class="eyebrow">'+t("upperB")+'</p><span class="strike">'+t("e3")+'<br><span class="num" style="font-size:.875rem">3 × 8–12 · 20 kg</span></span><br><span class="row__t">'+t("e3b")+'<br><span class="num" style="font-size:.875rem">3 × 8–12 · 15 kg</span></span></div>'+
    '<div class="diff" style="border:0"><p class="eyebrow">'+t("fromRafael")+'</p><span>'+t("msgV")+"</span></div></div></div>"+
    '<div class="actionbar"><p class="small">'+t("updB")+'</p><button class="btn primary" data-act="use">'+t("use")+'</button><button class="btn secondary" data-act="x">'+t("keep")+"</button></div>"}

// ---------- shell ----------
const $=s=>document.querySelector(s);
function render(){
  const who=STEPS[step][0],shown=view||who;
  document.documentElement.lang=lang==="pt"?"pt-BR":"en";
  $("#brandSub").textContent=t("brandSub");$("#restart").textContent=t("restart");
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===lang));
  $("#who").innerHTML=[["trainer","rafael"],["client","marina"]].map(p=>'<button data-act="view" data-v="'+p[0]+'" aria-pressed="'+(shown===p[0])+'">'+t(p[1])+"</button>").join("");
  $("#lblTrainer").innerHTML="<span>"+t("trainerLbl")+"</span>"+(who==="trainer"?'<span class="turn">'+t("turn")+"</span>":"");
  $("#lblClient").innerHTML="<span>"+t("clientLbl")+"</span>"+(who==="client"?'<span class="turn">'+t("turn")+"</span>":"");
  $("#guide").innerHTML='<span class="guide__n">'+(step+1)+"/"+STEPS.length+'</span><p class="guide__t">'+t("g"+step)+"</p>"+
    (step===4?'<button class="btn primary" data-act="skip">'+t("g4b")+"</button>":"")+(step===13?'<button class="btn primary" data-act="restart">'+t("restart")+"</button>":"")+
    (step>0&&step<13?'<button class="ghost" data-act="back">'+t("back")+"</button>":"");
  const T=step===0?roster():step===1?newClient():step===2?handoff():step<8?roster():step===8?clientDetail():step<12?adjust():clientDetail();
  const C=step<3?idle():step===3?gate():step<12?todayC():step===12?updateGate():todayC();
  $('.phone[data-who="trainer"]').innerHTML=T;$('.phone[data-who="client"]').innerHTML=C;
  document.querySelectorAll(".slot").forEach(s=>{const me=s.dataset.slot;s.hidden=me!==shown;s.classList.toggle("is-turn",me===who)});
  const tg=STEPS[step][1],el=$('.phone[data-who="'+who+'"] [data-act="'+tg+'"]:not(.scrim)')||$('#guide [data-act="'+tg+'"]');
  if(el){el.classList.add("hint");if(el.closest(".screen,.sheet"))el.scrollIntoView({block:"nearest"})}
}
function toast(phone){
  const host=phone||$(".slot:not([hidden]) .phone");if(!host)return;
  host.querySelectorAll(".toast").forEach(n=>n.remove());
  const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t("inert");host.appendChild(d);
  clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),1600)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="lang"){lang=b.dataset.v;try{localStorage.setItem("trainer-loop-lang",lang)}catch(x){}return render()}
  if(a==="view"){view=b.dataset.v;return render()}
  if(a==="restart"){step=0;view=null;return render()}
  if(a==="back"||a==="closeSheet"){step=Math.max(0,step-1);view=null;return render()}
  const inPhone=b.closest(".phone");
  if(a===STEPS[step][1]&&(!inPhone||inPhone.dataset.who===STEPS[step][0])){step++;view=null;return render()}
  toast(inPhone)});
render();
})();
</script>
</body></html>
