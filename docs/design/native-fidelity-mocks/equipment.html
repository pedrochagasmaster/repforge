<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><title>After: onboarding-recommend/equipment</title><style>
.sec{display:flex;align-items:baseline;gap:8px;margin:8px var(--gut) 0}.sec b{font-weight:var(--weight-semibold)}

.chk{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--boundary-required);flex:none;display:grid;place-items:center}
.chk.on{background:var(--accent-deep);box-shadow:none;color:var(--accent-ink)}.chk.on .icon-mask{width:14px;height:14px}
</style></head><body>
<div class="screen">
  <div class="bar"><button class="backbtn l"><i class="chevron chevron--back"></i><span>Back</span></button><span></span><button class="navbar__action r" style="font-weight:400">Cancel</button></div>
  <div class="sec"><b>Gym and equipment</b><span class="t-label">Section 2 of 3</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="lt" style="margin-top:18px"><h1 class="t-title">What equipment do you have there?</h1><p class="lede" style="font-size:var(--font-size-body-small)">Ticked items come from Home, basic kit. Tick what you have and untick what you don't.</p></div>
  <div class="group" style="margin-top:18px"><div class="list">
    <div class="li"><span>Barbell and plates</span><span class="chk"></span></div>
    <div class="li"><span>Squat rack</span><span class="chk"></span></div>
    <div class="li"><span>Bench</span><span class="chk"></span></div>
    <div class="li"><span>Dumbbells</span><span class="chk on"><i class="icon-mask icon-mask--check"></i></span></div>
    <div class="li"><span>Kettlebells</span><span class="chk on"><i class="icon-mask icon-mask--check"></i></span></div>
    <div class="li"><span>Pull-up bar</span><span class="chk on"><i class="icon-mask icon-mask--check"></i></span></div>
    <div class="li"><span>Dip bars</span><span class="chk"></span></div>
    <div class="li"><span>Cable machine</span><span class="chk"></span></div>
    <div class="li"><span>Resistance bands</span><span class="chk"></span></div>
  </div></div>
  <div class="actionbar"><button class="btn btn--primary">Continue <i class="arrow"></i></button></div>
</div></body></html>
