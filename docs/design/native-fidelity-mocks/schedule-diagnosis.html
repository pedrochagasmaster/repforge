<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><title>After: progress/schedule-diagnosis</title></head><body data-tab="progress">
<div class="screen">
  <div class="lt" style="padding-top:20px"><h1 class="t-title">Progress</h1></div>
  <div class="tabs-top"><span>Overview</span><span>Strength</span><span>Volume</span><span>PRs</span><span class="on">Review</span></div>
  <div class="group"><p class="group__cap t-label">What needs to change?</p><div class="list">
    <div class="li"><span>Fewer days available</span><span class="radio on"></span></div>
    <div class="li"><span>Sessions take too long</span><span class="radio"></span></div>
  </div></div>
  <div class="group"><p class="group__cap t-label">How many days can you train?</p><div class="list">
    <div class="li"><span>Days per week</span><span class="val"><span class="mono" style="color:var(--ink)">3</span><i class="icon-mask icon-mask--chev-down" style="width:16px;height:16px"></i></span></div>
  </div></div>
  <div style="margin:28px var(--gut) 0;display:grid;gap:4px"><button class="btn btn--primary">See the proposed plan <i class="arrow"></i></button><button class="btn btn--quiet">Cancel</button></div>
  <div class="fade"></div><nav class="dock"><span class="dock__lens"></span><button><i class="dock__ic i-log"></i><span class="dock__lb">Today</span></button><button><i class="dock__ic i-stats"></i><span class="dock__lb">Progress</span></button><button><i class="dock__ic i-history"></i><span class="dock__lb">History</span></button><button><i class="dock__ic i-program"></i><span class="dock__lb">Program</span></button></nav>
</div></body></html>
