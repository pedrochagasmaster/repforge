<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><title>After: workout/session</title><style>.sheetm{top:128px}.surface-li .li{background:var(--surface)}.surface-li .list,.surface-li .li+.li{border-color:var(--rule-on-surface)}.grp{margin-top:18px}.grp .group__cap{margin-bottom:4px}
.mr{display:grid;grid-template-columns:1fr auto 24px;gap:12px;align-items:center;min-height:52px}.mr+.mr{border-top:1px solid var(--rule-on-surface)}.mr .n{font-family:var(--font-training-data);font-feature-settings:"tnum";color:var(--ink-soft);font-size:var(--font-size-body-small)}.mr .g{width:18px;height:18px;color:var(--ink-faint)}.mr.cur span:first-child{font-weight:var(--weight-semibold)}.mr.cur .n{color:var(--accent-deep)}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px var(--gut) 24px;background:var(--surface);box-shadow:0 -.5px 0 var(--rule-on-surface);display:grid;gap:4px}
</style></head><body>
<div class="screen"><div class="under"><div class="bar" style="grid-template-columns:auto 1fr auto"><button class="iconbtn"><i class="chevron chevron--back"></i></button><span class="t" style="text-align:center">Barbell back squat</span><span style="display:flex"><button class="iconbtn"><i class="icon-mask icon-mask--timer"></i></button><button class="iconbtn"><i class="icon-mask icon-mask--sheet"></i></button><button class="iconbtn"><i class="icon-mask icon-mask--overflow"></i></button></span></div><div class="segbar" style="margin-top:12px"><i class="on"></i><i></i><i></i><i></i><i></i></div><p class="fx-meta"><span class="num">3 × 4–8</span> reps · RIR <span class="num">1</span> · Adaptive</p></div><div class="scrim"></div>
  <div class="sheetm" style="bottom:0">
    <span class="nf-grabber"></span>
    <div class="nf-sheet__head nf-sheet__head--left"><h2>Session details</h2><span class="trail"><button class="closebtn"><span><i class="icon-mask icon-mask--close"></i></span></button></span></div>
    <div class="nf-sheet__body surface-li">
      <p class="sheet-lede">Overview and workout notes</p>
      <div class="grp"><p class="group__cap t-label">Session map</p><div class="list">
        <div class="mr cur"><span>Barbell back squat</span><span class="n">0/3</span><i class="icon-mask icon-mask--grip g"></i></div>
        <div class="mr"><span>Barbell bench press</span><span class="n">0/3</span><i class="icon-mask icon-mask--grip g"></i></div>
        <div class="mr"><span>Seated leg curl</span><span class="n">0/2</span><i class="icon-mask icon-mask--grip g"></i></div>
        <div class="mr"><span>Cable seated row</span><span class="n">0/3</span><i class="icon-mask icon-mask--grip g"></i></div>
        <div class="mr"><span>Dumbbell lateral raise</span><span class="n">0/2</span><i class="icon-mask icon-mask--grip g"></i></div>
      </div></div>
      <div class="grp"><div class="list">
        <div class="li"><span>Date</span><span class="val"><span class="mono" style="color:var(--ink)">08/31/2026</span><i class="icon-mask icon-mask--cal" style="width:18px;height:18px"></i></span></div>
        <div class="li"><span>Bodyweight<span class="sub">optional</span></span><span class="val"><span class="mono">–</span> kg</span></div>
        <div class="li"><span>Session notes</span><i class="chevron"></i></div>
      </div></div>
    </div>
    <div class="foot"><button class="btn btn--secondary">Finish session early</button><button class="btn btn--quiet" style="color:var(--color-destructive);font-weight:600">End without saving</button></div>
  </div>
</div></body></html>
