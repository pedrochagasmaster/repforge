<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><title>After: program/editor-suggest-loads</title><style>.sheetm{top:96px}.edhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:0 8px;margin-top:20px;opacity:.6}.surface-li .li{background:var(--surface)}.surface-li .list,.surface-li .li+.li{border-color:var(--rule-on-surface)}</style></head><body data-tab="program">
<div class="screen" style="background:#000">
  <div style="position:absolute;inset:10px 0 0;background:var(--surface);border-radius:12px 12px 0 0;transform:scale(.94);transform-origin:50% 0"><div class="edhead"><span class="navbar__action" style="justify-self:start;font-weight:400">Cancel</span><b>Edit program</b><span class="navbar__action" style="justify-self:end">Done</span></div></div>
  <div class="scrim" style="background:rgba(0,0,0,.25)"></div>
  <div class="sheetm" style="bottom:0">
    <span class="nf-grabber"></span>
    <div class="nf-sheet__head nf-sheet__head--left"><h2>Dumbbell renegade row</h2><span class="trail"><button class="closebtn"><span><i class="icon-mask icon-mask--close"></i></span></button></span></div>
    <div class="nf-sheet__body surface-li">
      <div class="list" style="border-top:0">
        <div class="li"><span>Weeks<span class="sub">Same in all 7 weeks</span></span><span class="val">Adjust <i class="chevron"></i></span></div>
        <div class="li"><span>Suggest loads<span class="sub">Current rep target · <span class="mono">4–8</span></span></span><span class="nf-switch" aria-checked="true"></span></div>
        <div class="li"><span>RIR on every set</span><span class="nf-stepper"><output>2</output><span class="nf-stepper__btns"><button><i class="icon-mask icon-mask--minus"></i></button><button><i class="icon-mask icon-mask--plus"></i></button></span></span></div>
        <div class="li"><span>Smallest load change<span class="sub">Suggested loads move in steps of this size.</span></span><span class="nf-stepper"><output>2.5 kg</output><span class="nf-stepper__btns"><button><i class="icon-mask icon-mask--minus"></i></button><button><i class="icon-mask icon-mask--plus"></i></button></span></span></div>
      </div>
      <div class="group" style="margin:26px 0 0"><p class="group__cap t-label">How do you do this exercise?</p><div class="list">
        <div class="li"><span>Both sides together</span><span class="radio"></span></div>
        <div class="li"><span>One side at a time</span><span class="radio"></span></div>
      </div></div>
      <div class="group" style="margin:26px 0 0"><div class="list"><div class="li"><span>Swap exercise</span><i class="chevron"></i></div></div></div>
    </div>
  </div>
</div></body></html>
