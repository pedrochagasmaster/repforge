<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><title>After: history/session</title><style>
.blk{margin:0 var(--gut)}.blk+.blk{margin-top:28px}.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.bh b{font-size:var(--font-size-subtitle);font-weight:var(--weight-semibold)}
.vd{display:inline-flex;gap:12px;font-size:var(--font-size-body-small);font-weight:var(--weight-semibold)}.vd .up{color:var(--accent-deep)}.vd .pr{color:var(--positive)}.vd .eq{color:var(--ink-soft)}
.st{display:grid;grid-template-columns:2.5em 1fr 1fr 1fr;margin-top:10px}.st>*{padding:9px 0;text-align:right}.st>*:nth-child(4n+1){text-align:left}.st .h{padding:4px 0 6px;font-size:var(--font-size-label);font-weight:var(--weight-semibold);letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;box-shadow:inset 0 -1px 0 var(--rule)}
.st .c{font-family:var(--font-training-data);font-feature-settings:"tnum";box-shadow:inset 0 -.5px 0 var(--rule)}.st .c.n{color:var(--ink-soft)}
</style></head><body data-tab="history">
<div class="screen">
  <div class="bar bar--glass"><button class="backbtn l"><i class="chevron chevron--back"></i><span>History</span></button><span></span><span></span></div>
  <div style="padding-top:70px">

  <div class="blk"><div class="bh"><b>Dumbbell lateral raise</b><span class="vd"><span class="up">↑ Improved</span></span></div><p class="cap p">Before, 24 Aug: <span class="num">10 × 12, 11</span></p>
    <div class="st"><span class="h">Set</span><span class="h">Load kg</span><span class="h">Reps</span><span class="h">RIR</span><span class="c n">1</span><span class="c">10</span><span class="c">13</span><span class="c">1</span><span class="c n">2</span><span class="c">10</span><span class="c">12</span><span class="c">1</span></div></div>

    <div class="st"><span class="h">Set</span><span class="h">Load kg</span><span class="h">Reps</span><span class="h">RIR</span><span class="c n">1</span><span class="c">45</span><span class="c">10</span><span class="c">2</span><span class="c n">2</span><span class="c">45</span><span class="c">10</span><span class="c">1</span></div></div>
  <div class="group"><div class="list"><div class="li"><span>Edit</span><i class="icon-mask icon-mask--pencil" style="width:20px;height:20px;color:var(--ink-soft)"></i></div><div class="li" style="color:var(--color-destructive)"><span>Delete session</span><span></span></div></div></div>
  </div>
  <div class="fade"></div><nav class="dock"><span class="dock__lens"></span><button><i class="dock__ic i-log"></i><span class="dock__lb">Today</span></button><button><i class="dock__ic i-stats"></i><span class="dock__lb">Progress</span></button><button><i class="dock__ic i-history"></i><span class="dock__lb">History</span></button><button><i class="dock__ic i-program"></i><span class="dock__lb">Program</span></button></nav>
