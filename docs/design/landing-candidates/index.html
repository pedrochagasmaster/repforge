<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2EF">
<title>Taurifer landing candidates</title>
<link rel="icon" href="../../../icons/favicon-32.png">
<style>
@font-face{font-family:"Plex Sans";src:url("../../../fonts/plexsans.woff2") format("woff2");font-weight:100 700;font-display:swap}
@font-face{font-family:"Plex Mono";src:url("../../../fonts/plexmono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Mono";src:url("../../../fonts/plexmono-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex Mono";src:url("../../../fonts/plexmono-600.woff2") format("woff2");font-weight:600;font-display:swap}

/* ---------- shared tokens (Taurifer light) ---------- */
:root{
  --rv:92px;
  --bg:#F4F2EF;--card:#FFFFFF;--well:#FAF8F5;--ink:#1B1A17;--soft:#6E6A63;--faint:#716D66;
  --rule:#E4E1DA;--rule2:#D9D5CD;--accent:#E04E14;--accent-rgb:224,78,20;--deep:#B8410E;
  --cta:#161513;--cta-ink:#FFFFFF;--pos:#2F7D33;
  --sans:"Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;--g:16px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--rv) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-top:var(--rv)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.28);border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- review chrome (not part of any candidate) ---------- */
.rv{position:fixed;inset:0 0 auto 0;z-index:100;background:#1B1A17;color:#F2EFE9;padding:8px 10px 8px;padding-top:max(8px,env(safe-area-inset-top));font-size:12px}
.rv__tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#2A2824;border-radius:12px;padding:3px}
.rv__tab{appearance:none;border:0;background:transparent;border-radius:9px;min-height:44px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:#ADA79D;transition:background .18s var(--ease),color .18s var(--ease)}
.rv__tab b{font:600 13px/1 var(--mono);color:inherit}
.rv__tab span{font-size:11px;line-height:1.1;font-weight:500}
.rv__tab[aria-selected="true"]{background:#F4F2EF;color:#1B1A17}
.rv__tab[aria-selected="true"] b{color:#B8410E}
.rv__row{display:flex;align-items:center;gap:10px;margin-top:7px}
.rv__note{flex:1;margin:0;color:#D6D0C6;line-height:1.35;font-size:12px}
.rv__note strong{color:#F2EFE9;font-weight:600}
.rv__lang{display:flex;border:1px solid #4A453D;border-radius:999px;overflow:hidden;flex:none}
.rv__lang button{appearance:none;border:0;background:transparent;color:#ADA79D;font:600 11px/1 var(--sans);letter-spacing:.08em;padding:0 11px;min-height:32px;min-width:44px;cursor:pointer}
.rv__lang button[aria-pressed="true"]{background:#F2EFE9;color:#1B1A17}

/* ---------- shared bits ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 var(--g)}
.label{font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.label--accent{color:var(--deep)}
.cta{display:flex;align-items:center;justify-content:center;position:relative;width:100%;min-height:54px;padding:13px 48px;border-radius:var(--r);background:var(--cta);color:var(--cta-ink);font:600 17px/1.2 var(--sans);text-decoration:none;border:0;transition:transform .12s var(--ease)}
.cta:active{transform:translateY(1px) scale(.995)}
.cta svg{position:absolute;right:18px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--accent)}
.link2{display:flex;align-items:center;justify-content:center;min-height:44px;font-weight:600;font-size:15px;text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:4px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--card);font-weight:600;font-size:13px;text-decoration:none}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font:650 18px/1 var(--sans);letter-spacing:-.01em}
.brand img{width:30px;height:30px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.mono{font-family:var(--mono)}
.phone{display:block;margin:0 auto;width:min(74vw,330px);aspect-ratio:903/1832;height:auto}
details.faq{border-top:1px solid var(--rule)}
details.faq:last-child{border-bottom:1px solid var(--rule)}
details.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 0;font-weight:600;font-size:16px;cursor:pointer}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary i{flex:none;width:20px;height:20px;position:relative}
details.faq summary i::before,details.faq summary i::after{content:"";position:absolute;left:3px;right:3px;top:9px;height:1.75px;background:currentColor;border-radius:2px;transition:transform .2s var(--ease)}
details.faq summary i::after{transform:rotate(90deg)}
details.faq[open] summary i::after{transform:rotate(0)}
details.faq p{margin:0 0 16px;color:var(--soft)}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .26s var(--ease),transform .26s var(--ease)}
.reveal.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}

/* ============ A · Caderno ============ */
.A header{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.A .hero{padding:22px 0 8px}
.A h1{font:650 2.3rem/1.04 var(--sans);letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
.A .lede{font-size:17px;line-height:1.45;color:var(--soft);margin:0 0 24px;text-wrap:pretty}
.A .meta{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:14px 0 0;font:500 12px/1.3 var(--mono);color:var(--faint)}
.A .meta span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rule2);margin-right:8px;vertical-align:2px}
.A .ledger{margin:34px 0 0}
.A .ledger__head{padding:14px 14px 12px}
.A .ledger__ex{font:600 1.0625rem/1.3 var(--sans);margin:5px 0 2px}
.A .ledger__rx{color:var(--soft);font-size:14px}
.A .grid{display:grid;grid-template-columns:52px 1fr 1fr 1fr 28px;align-items:center;padding:0 14px}
.A .grid--h{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:34px}
.A .row{min-height:48px;border-bottom:1px solid var(--rule);font:500 16px/1 var(--mono)}
.A .row .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);transform:scale(.2);opacity:0;transition:transform .2s var(--ease),opacity .2s var(--ease)}
.A .row .v{opacity:0;transition:opacity .18s var(--ease)}
.A .row.on .v{opacity:1}.A .row.on .ck{transform:none;opacity:1}
.A .row .n{color:var(--soft)}
.A .next{background:var(--well);padding:16px 14px 16px 16px;position:relative;opacity:.35;transition:opacity .26s var(--ease)}
.A .next::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--accent);border-radius:2px;transform:scaleY(0);transition:transform .26s var(--ease)}
.A .next.on{opacity:1}.A .next.on::before{transform:none}
.A .next__load{font:500 2rem/1.05 var(--mono);margin:6px 0 8px;letter-spacing:-.01em}
.A .next__load small{font-size:15px;color:var(--soft);font-weight:400}
.A .next p{margin:0;color:var(--soft);font-size:14px}
.A .foot{font-size:12px;color:var(--faint);margin:10px 2px 0}
.A section{padding:48px 0 0}
.A .idx{font:500 12px/1 var(--mono);color:var(--faint)}
.A .idx b{color:var(--deep);font-weight:600}
.A h2{font:650 1.625rem/1.1 var(--sans);letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
.A .sub{color:var(--soft);margin:0 0 18px;font-size:16px}
.A .lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.A .lines li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--rule)}
.A .lines .k{font:500 12px/1.6 var(--mono);color:var(--faint)}
.A .lines h3{font:600 16px/1.3 var(--sans);margin:0 0 3px}
.A .lines p{margin:0;color:var(--soft);font-size:14.5px}
.A .shot{margin:8px -16px 0;padding:0 16px;display:flex;justify-content:center}
.A .kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px;margin:18px 0 0;border-top:1px solid var(--rule)}
.A .kv dt,.A .kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--rule)}
.A .kv dt{font:600 11px/1.9 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.A .kv dd{font-size:14.5px}
.A .close{padding:56px 0 20px}
.A footer{display:flex;justify-content:space-between;align-items:center;padding:28px 0 40px;border-top:1px solid var(--rule);margin-top:36px;color:var(--faint);font-size:13px}
.A footer a{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;margin-left:14px}

/* ============ B · Noite ============ */
.B{--bg:#141310;--card:#1E1C18;--well:#191713;--ink:#F2EFE9;--soft:#ADA79D;--faint:#99938A;--rule:#2E2B26;--rule2:#4A453D;--accent:#F2703B;--accent-rgb:242,112,59;--deep:#FF8A3D;--cta:#F2703B;--cta-ink:#141310;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
.B .cta svg{color:var(--cta-ink)}
.B header{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.B .brand img{background:#F4F2EF;border-radius:8px;padding:3px}
.B .pill{background:transparent;border-color:var(--rule2);color:var(--ink)}
.B .hero{padding:26px 0 0;text-align:left}
.B h1{font:650 2.45rem/1.06 var(--sans);letter-spacing:-.02em;margin:0 0 16px}
.B h1 span{display:block}
.B h1 .hot{color:var(--accent)}
.B .lede{color:var(--soft);font-size:17px;margin:0 0 24px;text-wrap:pretty}
.B .hero-phone{margin:34px auto 0;width:min(84vw,360px)}
.B .kick{display:flex;gap:18px;justify-content:center;font:500 12px/1 var(--mono);color:var(--faint);margin-top:16px}
.B section{padding:64px 0 0}
.B h2{font:650 1.75rem/1.1 var(--sans);letter-spacing:-.02em;margin:10px 0 10px;text-wrap:balance}
.B .sub{color:var(--soft);margin:0;font-size:16px}
.B .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px var(--g) 8px;margin:0 calc(var(--g) * -1);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.B .rail::-webkit-scrollbar{display:none}
.B .slide{flex:0 0 78%;scroll-snap-align:center;display:flex;flex-direction:column}
.B .slide .n{font:500 12px/1 var(--mono);color:var(--accent)}
.B .slide h3{font:600 17px/1.3 var(--sans);margin:8px 0 4px}
.B .slide p{margin:0 0 12px;color:var(--soft);font-size:14.5px;min-height:3.9em}
.B .slide img{width:100%;margin-top:auto}
.B .dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.B .dots i{width:6px;height:6px;border-radius:50%;background:var(--rule2);transition:width .2s var(--ease),background .2s var(--ease)}
.B .dots i.on{width:18px;border-radius:3px;background:var(--ink)}
.B .quiet{border-top:1px solid var(--rule);margin-top:22px}
.B .quiet li{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule)}
.B .quiet ul{margin:0;padding:0}
.B .quiet b{font:600 18px/1.25 var(--sans)}
.B .quiet span{color:var(--soft);font-size:14px;text-align:right}
.B .steps{display:grid;gap:10px;margin-top:20px}
.B .step{padding:14px}
.B .step h3{font:600 16px/1.3 var(--sans);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.B .step ol{margin:0;padding-left:20px;color:var(--soft);font-size:14.5px}
.B .step li{padding:2px 0}
.B .step b{color:var(--ink);font-weight:600}
.B .dock{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;border-radius:22px;padding:6px;background:rgba(30,28,24,.78);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35);transform:translateY(140%);transition:transform .26s var(--ease);max-width:528px;margin:0 auto}
.B .dock.on{transform:none}
.B .dock .cta{border-radius:16px}
.B footer{padding:40px 0 20px;color:var(--faint);font-size:13px;border-top:1px solid var(--rule);margin-top:56px}

/* ============ C · Números ============ */
.C header{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.C .hero{padding:18px 0 0}
.C .big{font:500 clamp(104px,36vw,168px)/.86 var(--mono);letter-spacing:-.02em;margin:14px 0 0;display:flex;align-items:flex-start;gap:6px;white-space:nowrap}
.C .big .cm{font-style:normal;margin:0 -.22em}
.C .big small{font:500 22px/1 var(--mono);color:var(--soft);letter-spacing:0;margin-top:14px}
.C .big-sub{font:500 16px/1.3 var(--mono);color:var(--soft);margin:12px 0 0;display:flex;gap:10px;align-items:center}
.C .big-sub::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
.C h1{font:650 2.35rem/1.04 var(--sans);letter-spacing:-.02em;margin:34px 0 12px;padding-top:22px;border-top:1px solid var(--ink)}
.C .lede{color:var(--soft);font-size:17px;margin:0 0 24px;text-wrap:pretty}
.C section{padding:56px 0 0}
.C h2{font:650 1.625rem/1.1 var(--sans);letter-spacing:-.02em;margin:10px 0 10px;text-wrap:balance}
.C .sub{color:var(--soft);margin:0;font-size:16px}
.C .board{position:sticky;top:calc(var(--rv) + 8px);z-index:5;margin:22px 0 0;padding:14px;background:var(--card)}
.C .board__top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.C .board__verdict{font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--deep);display:flex;align-items:center;gap:6px}
.C .board__verdict svg{width:14px;height:14px}
.C .board__load{font:500 44px/1 var(--mono);margin:10px 0 4px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.C .board__load small{font-size:16px;color:var(--soft);letter-spacing:0}
.C .board__load .cm{font-style:normal;margin:0 -.2em}
.C .board__was{font:400 13px/1.3 var(--mono);color:var(--soft)}
.C .board__load span{display:inline-block;transition:opacity .16s var(--ease),transform .16s var(--ease)}
.C .board.swap .board__load span{opacity:0;transform:translateY(-6px)}
.C .case{min-height:62vh;padding:36px 0 0}
.C .case__k{font:500 12px/1 var(--mono);color:var(--faint)}
.C .case h3{font:600 1.25rem/1.25 var(--sans);margin:8px 0 12px}
.C table{width:100%;border-collapse:collapse;font:500 15px/1 var(--mono)}
.C th{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 0 10px}
.C td{padding:12px 0;border-top:1px solid var(--rule)}
.C .rule{margin:14px 0 0;padding:12px 14px;background:var(--well);border-radius:12px;border:1px solid var(--rule);color:var(--ink);font-size:15px}
.C .rir{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:22px 0 8px}
.C .rir i{aspect-ratio:1;border-radius:50%;background:var(--ink)}
.C .rir i.res{background:transparent;box-shadow:inset 0 0 0 1.75px var(--accent)}
.C .rir-cap{display:flex;justify-content:space-between;font:500 12px/1.3 var(--mono);color:var(--soft)}
.C .eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;font:500 22px/1.2 var(--mono);margin:22px 0 10px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.C .eq em{font-style:normal;color:var(--faint)}
.C .eq small{display:block;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.C .eq .res{color:var(--deep)}
.C .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);margin-top:20px}
.C .facts div{padding:16px 0 16px;border-bottom:1px solid var(--rule)}
.C .facts div:nth-child(odd){padding-right:12px;border-right:1px solid var(--rule)}
.C .facts div:nth-child(even){padding-left:14px}
.C .facts b{display:block;font:500 36px/1 var(--mono);letter-spacing:-.01em}
.C .facts span{display:block;color:var(--soft);font-size:14px;margin-top:8px}
.C .close{padding:64px 0 0}
.C footer{padding:36px 0 40px;color:var(--faint);font-size:13px}

/* ============ D · Traga o seu ============ */
.D header{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.D .hero{padding:20px 0 0}
.D h1{font:650 2.3rem/1.05 var(--sans);letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
.D .lede{color:var(--soft);font-size:17px;margin:0 0 24px;text-wrap:pretty}
.D .demo{margin:34px 0 0;position:relative}
.D .msg{background:var(--card);border:1px solid var(--rule);border-radius:18px 18px 18px 6px;padding:12px 14px 10px;max-width:88%;font-size:15px;line-height:1.5}
.D .msg__who{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--faint);margin-bottom:6px}
.D .msg__who b{color:var(--deep);font-weight:600}
.D .msg pre{margin:0;font:400 15px/1.5 var(--sans);white-space:pre-wrap}
.D .turn{display:flex;align-items:center;gap:10px;margin:14px 0 14px 18px;color:var(--faint);font:500 12px/1.3 var(--mono)}
.D .turn svg{width:22px;height:22px;color:var(--accent);flex:none}
.D .prog__head{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.D .prog__title{font:600 17px/1.25 var(--sans);margin:4px 0 0}
.D .prog li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--rule)}
.D .prog ul{margin:0;padding:0}
.D .prog .nm{font-weight:600;font-size:15px}
.D .prog .rx{font:500 15px/1.3 var(--mono);text-align:right}
.D .prog .src{grid-column:1/-1;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px}
.D .prog .src svg{width:14px;height:14px;color:var(--pos);flex:none}
.D .prog li{opacity:0;transform:translateY(6px);transition:opacity .22s var(--ease),transform .22s var(--ease)}
.D .prog li.on{opacity:1;transform:none}
.D section{padding:56px 0 0}
.D h2{font:650 1.625rem/1.1 var(--sans);letter-spacing:-.02em;margin:10px 0 10px;text-wrap:balance}
.D .sub{color:var(--soft);margin:0;font-size:16px}
.D .how{list-style:none;margin:22px 0 0;padding:0;counter-reset:s}
.D .how li{position:relative;padding:0 0 22px 46px;counter-increment:s}
.D .how li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule2);display:grid;place-items:center;font:600 13px/1 var(--mono);background:var(--bg)}
.D .how li::after{content:"";position:absolute;left:15px;top:30px;bottom:2px;width:1px;background:var(--rule2)}
.D .how li:last-child::after{display:none}
.D .how h3{font:600 16px/1.3 var(--sans);margin:2px 0 4px}
.D .how p{margin:0;color:var(--soft);font-size:14.5px}
.D .note{margin:6px 0 0;padding:12px 14px;border-radius:12px;background:var(--well);border:1px solid var(--rule);font-size:14px;color:var(--soft);display:flex;gap:10px}
.D .note svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--ink)}
.D .share{margin-top:20px}

.D .share__ic svg{width:20px;height:20px}
.D .share__row b{display:block;font-size:15px}
.D .share__row span{display:block;font-size:13px;color:var(--soft)}
.D .share__cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}

.D .ticks svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.D .close{padding:60px 0 0}
.D footer{padding:36px 0 40px;color:var(--faint);font-size:13px}

/* ============ E · Vitrine ============ */
.E{padding-bottom:96px}
.E .top{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:24px 0 0}

.E h1{font:650 1.75rem/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 4px}
.E .tag{color:var(--soft);font-size:15px;margin:0 0 10px;line-height:1.3}
.E .open{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 20px;border-radius:999px;background:var(--cta);color:var(--cta-ink);font-weight:600;font-size:15px;text-decoration:none;position:relative}

.E .shots figure{flex:0 0 56%;margin:0;scroll-snap-align:start;background:var(--well);border:1px solid var(--rule);border-radius:18px;padding:12px 6px 6px;overflow:hidden}
.E .shots figcaption{font:600 13px/1.25 var(--sans);padding:0 8px 8px;min-height:2.6em}
.E section{padding:30px 0 0}
.E h2{font:650 1.25rem/1.2 var(--sans);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.E .desc p{margin:0 0 10px;font-size:15.5px}
.E .desc .more{display:none}

.E .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:12px;padding:3px;margin:0 0 14px}
.E .seg button{appearance:none;border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;color:var(--soft)}

.E .inst li:first-child{border-top:0}
.E .inst .g{width:40px;height:40px;border-radius:11px;background:var(--well);border:1px solid var(--rule);display:grid;place-items:center}
.E .inst .g svg{width:20px;height:20px}
.E .inst b{font-weight:600}
.E .priv__row{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px;border-top:1px solid var(--rule)}
.E .priv__row:first-child{border-top:0}
.E .priv__row svg{width:22px;height:22px;margin-top:1px}
.E .priv__row b{display:block;font-size:15px}
.E .priv__row span{display:block;color:var(--soft);font-size:14px}

.E dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}

.E .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(250,248,245,.82);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--rule);padding:10px var(--g) calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .26s var(--ease)}

function initE(root){
  var desc = root.querySelector("#desc"), btn = root.querySelector("#descBtn");
  btn.addEventListener("click", function(){ var o = desc.classList.toggle("open"); btn.setAttribute("aria-expanded", o); btn.textContent = o ? L("menos","less") : L("mais","more"); });
  root.querySelectorAll("[data-os]").forEach(function(b){
    b.addEventListener("click", function(){
      root.querySelectorAll("[data-os]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
      root.querySelectorAll("[data-os-list]").forEach(function(l){ l.hidden = l.dataset.osList !== b.dataset.os; });
    });
  });
  if (/android/i.test(navigator.userAgent)) root.querySelector('[data-os="and"]').click();
  stickyWhenGone(root.querySelector("#eTop"), root.querySelector("#eBar"));
}

/* ---------------- helpers ---------------- */
function faq(items){ return items.map(function(q){ return '<details class="faq"><summary>' + q[0] + '<i aria-hidden="true"></i></summary><p>' + q[1] + '</p></details>'; }).join(""); }
var observers = [];
function track(io){ observers.push(io); return io; }
function once(el, fn, threshold){
  var io = track(new IntersectionObserver(function(es){ if (es[0].isIntersecting){ io.disconnect(); fn(); } }, { threshold: threshold || .3 }));
  io.observe(el);
}
function stickyWhenGone(anchor, bar){
  var io = track(new IntersectionObserver(function(es){ bar.classList.toggle("on", !es[0].isIntersecting && es[0].boundingClientRect.top < 0); }));
  io.observe(anchor);
}

/* ---------------- switcher ---------------- */
var CANDS = [
  { id:"A", name:{pt:"Caderno",en:"Ledger"}, render:A, init:initA, theme:"#F4F2EF",
    note:{pt:"<strong>Caderno.</strong> A página é o próprio caderno de treino: uma sessão real se preenche linha por linha e a meta seguinte aparece embaixo.",en:"<strong>Ledger.</strong> The page is the training ledger itself: a real session fills in row by row and the next target lands underneath."} },
  { id:"B", name:{pt:"Noite",en:"Night"}, render:B, init:initB, theme:"#141310",
    note:{pt:"<strong>Noite.</strong> Escuro e guiado pelo produto: o app de verdade em primeiro plano, uma sessão inteira para arrastar e o CTA sempre na mão.",en:"<strong>Night.</strong> Dark and product-led: the real app up front, a full session to swipe through, and the CTA always under the thumb."} },
  { id:"C", name:{pt:"Números",en:"Numbers"}, render:C, init:initC, theme:"#F4F2EF",
    note:{pt:"<strong>Números.</strong> Um cartaz tipográfico: o próximo número é o produto, e a página prova a conta com três saídas reais do motor.",en:"<strong>Numbers.</strong> A typographic poster: the next number is the product, and the page proves the maths with three real engine outputs."} },
  { id:"D", name:{pt:"Traga",en:"Bring"}, render:D, init:initD, theme:"#F4F2EF",
    note:{pt:"<strong>Traga o seu.</strong> Aquisição pela migração: parte da ficha ou do WhatsApp do personal, onde o treino do brasileiro já está hoje.",en:"<strong>Bring yours.</strong> Acquisition through migration: it starts from the gym sheet or the coach's WhatsApp, where Brazilian lifters' programs already live."} },
  { id:"E", name:{pt:"Vitrine",en:"Listing"}, render:E, init:initE, theme:"#F4F2EF",
    note:{pt:"<strong>Vitrine.</strong> Sem loja de apps, a página vira a ficha da loja: ícone, capturas, instalação passo a passo e rótulo de privacidade.",en:"<strong>Listing.</strong> With no app store, the page becomes the store listing: icon, screenshots, step-by-step install and a privacy label."} }
];
var current = 0, stage = document.getElementById("stage"), tabs = document.getElementById("tabs"), note = document.getElementById("note");
var themeMeta = document.querySelector('meta[name="theme-color"]');
function save(){ try { history.replaceState(null, "", "#" + CANDS[current].id + "-" + lang); } catch (e) {} }
function render(scroll){
  observers.forEach(function(o){ o.disconnect(); }); observers = [];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  var c = CANDS[current];
  tabs.innerHTML = CANDS.map(function(x, i){ return '<button type="button" role="tab" class="rv__tab" aria-selected="' + (i === current) + '" data-i="' + i + '"><b>' + x.id + '</b><span>' + x.name[lang] + '</span></button>'; }).join("");
  note.innerHTML = c.note[lang];
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === lang); });
  document.body.style.background = c.theme;
  themeMeta.setAttribute("content", c.theme);
  stage.innerHTML = c.render();
  c.init(stage);
  if (scroll) window.scrollTo(0, 0);
  save();
}
tabs.addEventListener("click", function(e){ var b = e.target.closest("[data-i]"); if (!b) return; current = +b.dataset.i; render(true); });
document.querySelectorAll("[data-lang]").forEach(function(b){ b.addEventListener("click", function(){ lang = b.dataset.lang; render(false); }); });
var rv = document.getElementById("rv");
function fit(){ document.documentElement.style.setProperty("--rv", rv.offsetHeight + "px"); }
new ResizeObserver(fit).observe(rv);
var m = /^#([A-E])-(pt|en)$/.exec(location.hash);
if (m){ current = "ABCDE".indexOf(m[1]); lang = m[2]; }
render(false); fit();
})();
</script>
