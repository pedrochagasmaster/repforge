<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan 084 · disposable gauge prototype</title>
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div id="phone"></div>
  <aside class="prototype-tools" aria-label="Prototype controls">
    <div><button id="previous" aria-label="Previous direction">←</button><strong id="direction"></strong><button id="next" aria-label="Next direction">→</button></div>
    <label>Screen <select id="screen"><option value="today">Today</option><option value="overview">Overview</option><option value="finish">Finish</option></select></label>
    <label>Evidence <select id="stage"><option value="fresh">Fresh</option><option value="mid">Mid-way</option><option value="full">Well-tailored</option></select></label>
    <label>Language <select id="lang"><option value="pt">PT</option><option value="en">EN</option></select></label>
    <label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <button id="replay">Replay saved change</button>
    <output id="fixture"></output>
  </aside>
  <script src="prototype.js"></script>
</body>
</html>
