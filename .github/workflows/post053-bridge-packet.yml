name: Post-053 bridge packet transport

on:
  push:
    branches: [architecture/post053-durable-state-bridge]
    paths: [.github/workflows/post053-bridge-packet.yml]

permissions:
  contents: write

concurrency:
  group: post053-bridge-packet
  cancel-in-progress: false

jobs:
  packet:
    if: github.repository == 'pedrochagasmaster/repforge' && github.ref == 'refs/heads/architecture/post053-durable-state-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Revalidate pinned merged base and transport-only input
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = bad6cc9d04fd34889745cce0ea200cc9d9d7e6b5
          git merge-base --is-ancestor dd704100151fa476e8be6d35bd8d68e931479259 origin/main
          printf '%s\n' .github/workflows/post053-bridge-packet.yml .bridge-ratify.py.gz | sort >/tmp/allowed-input
          git diff --name-only origin/main HEAD | sort >/tmp/actual-input
          diff -u /tmp/allowed-input /tmp/actual-input
          mkdir -p /tmp/bridge-workbench/github-main
          git cat-file commit origin/main >/tmp/bridge-workbench/base-commit.raw
          git cat-file commit HEAD >/tmp/bridge-workbench/transport-commit.raw
          git show origin/main:.github/workflows/simulation.yml >/tmp/bridge-workbench/github-main/simulation.yml
          git show origin/main:.github/workflows/install-transfer-service.yml >/tmp/bridge-workbench/github-main/install-transfer-service.yml
      - name: Apply only the owner-ratified documentation allocation
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .bridge-ratify.py.gz >/tmp/bridge-ratify.py
          echo '33a9548b3a977f1b894aeffa58b99ec7b4bd12525df7e8bedd0f19a5e48902e7  /tmp/bridge-ratify.py' | sha256sum -c -
          python /tmp/bridge-ratify.py | tee /tmp/bridge-workbench/ratified-hashes.txt
          git diff --check
          node tools/check-canonical-contradictions.mjs --check
          node tools/run-tests.mjs --check
          node --test test/ci.mjs
          git diff --name-only >/tmp/bridge-workbench/documentation-paths.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
          'docs/backlog.md': '127f282e2576bb442ef3586f44b4a74b458b32514a8d1f6ac4b83e6819482d3f',
          'docs/ui-overhaul-implementation-sequence.md': '69291ab04d943dd0006b6a9927c42ef76ba80860a656cff679f4b7e28028247f',
          'docs/taurifer-architecture-refactoring-plan.md': 'fc15d99dd203adf0402babe48cd725f3f5de3d97a6c0f35c7c7209208f777fdc',
          'docs/taurifer-architecture-review.html': '122ec78ddecb84643c5d4618265f31fca5acda2a7b7703363bb7a7e017f64905',
          'plans/054-landing-and-program-entry.md': '4475c12853ac654b8159a55796fb7ec077f16117d68ad0fad402c16a080c2756',
          'plans/055-focus-only-workout.md': '78b23728116301faee89c1438e3af9bdcff9d0edc10fb00f0524097d811b4a29',
          'plans/056-progress-and-block-lifecycle.md': '1acda0eab71f974be5cdd4ad00dfbdfa1379bba8bc799a47a5640adcfed7c916',
          'plans/057-management-surfaces.md': '3dc485fb2279df86889f95a377461351d5a4a9740d502ed9e78b4c5fbc186675',
          'plans/058-design-system-convergence.md': '11c626d4402d5973d5b988a568237f17d8c97d6bbad674b7a6ae028a91e5bf3c',
          'plans/059-public-launch-ui-validation.md': 'ba4cbd327aa9fbc58b264972024dab04498377f4b7830801d5f96614c62952ac',
          'plans/README.md': '9b648a2106627a1d182ff5fea9dce7760ecc88983fc88b10176735740dcc9e19'
          }
          assert set(Path('/tmp/bridge-workbench/documentation-paths.txt').read_text().splitlines()) == set(expected)
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/backlog.md docs/ui-overhaul-implementation-sequence.md docs/taurifer-architecture-refactoring-plan.md docs/taurifer-architecture-review.html plans/README.md plans/054-landing-and-program-entry.md plans/055-focus-only-workout.md plans/056-progress-and-block-lifecycle.md plans/057-management-surfaces.md plans/058-design-system-convergence.md plans/059-public-launch-ui-validation.md
          git commit -m 'docs(architecture): ratify PR239 disposition in the existing execution sequence'
          git rev-parse HEAD >/tmp/bridge-workbench/documentation-sha.txt
          git cat-file commit HEAD >/tmp/bridge-workbench/documentation-commit.raw
          git rm -- .github/workflows/post053-bridge-packet.yml .bridge-ratify.py.gz
          git commit -m 'chore: remove one-shot documentation packet transport'
          git cat-file commit HEAD >/tmp/bridge-workbench/head-commit.raw
          git rev-parse HEAD >/tmp/bridge-workbench/head-sha.txt
          git fetch origin architecture/post053-durable-state-bridge
          test "$(git rev-parse origin/architecture/post053-durable-state-bridge)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/architecture/post053-durable-state-bridge
      - name: Export pinned test tooling for the network-isolated workbench
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix test
          (cd test && npx playwright install --only-shell chromium)
          tar -C test -czf /tmp/bridge-workbench/test-dependencies.tar.gz node_modules
          tar -C "$HOME/.cache" -czf /tmp/bridge-workbench/browser.tar.gz ms-playwright
      - name: Retain exact commit provenance and test tooling only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post053-bridge-workbench
          path: /tmp/bridge-workbench/
          include-hidden-files: true
          retention-days: 1
