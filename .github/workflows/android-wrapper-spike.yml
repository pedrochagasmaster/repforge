name: Build Taurifer Android Lab (signed debug APK)

on:
  push:
    branches:
      - experiment/android-webview-spike
    paths:
      - 'experiments/android-spike/**'
      - '.github/workflows/android-wrapper-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate runner Android SDK and install packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile signed debug APK
        working-directory: experiments/android-spike
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signature and manifest
        run: |
          set -euo pipefail
          apk='experiments/android-spike/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1,15p'
          sha256sum "$apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TauriferAndroidLab-debug-APK
          path: experiments/android-spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
