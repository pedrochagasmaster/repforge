name: Interaction runtime contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  interaction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify motion discipline contract
        run: node test/motion-polish.mjs

      - name: Verify vendored runtimes, payload budget, the Motion layer and Apple follow-up
        run: |
          node tools/build-vendor-runtimes.mjs --check
          node test/vendor-runtimes.mjs
          node test/runtime-budget.mjs
          node test/apple-design-followup.mjs

      - name: Verify offline shell contract
        run: node test/exercise-library.mjs
