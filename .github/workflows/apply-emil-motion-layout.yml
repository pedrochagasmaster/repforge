name: Apply Emil motion layout

on:
  push:
    branches: [ui/emil-motion-polish]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ui/emil-motion-polish
          fetch-depth: 0

      - name: Normalize stylesheet layout and cache revision
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper_path = Path("styles.css")
          base_path = Path("styles-base.css")
          motion_path = Path("motion-polish.css")
          index_path = Path("index.html")
          sw_path = Path("sw.js")
          test_path = Path("test/motion-polish.mjs")

          wrapper = wrapper_path.read_text()
          base = base_path.read_text()
          prefix = '@import url("./styles-base.css");\n\n'
          if not wrapper.startswith(prefix):
              raise SystemExit("unexpected motion wrapper shape")
          motion = wrapper[len(prefix):]
          motion = motion.replace(
              "   The base stylesheet remains byte-for-byte intact in styles-base.css.\n"
              "   This layer narrows motion in the high-frequency training loop, preserves\n",
              "   This layer narrows motion in the high-frequency training loop, preserves\n",
              1,
          )
          motion_path.write_text(motion)
          wrapper_path.write_text(base)
          base_path.unlink()

          index = index_path.read_text()
          base_link = '  <link rel="stylesheet" href="styles.css">'
          motion_link = '  <link rel="stylesheet" href="motion-polish.css">'
          if motion_link not in index:
              if base_link not in index:
                  raise SystemExit("styles.css link not found")
              index = index.replace(base_link, base_link + "\n" + motion_link, 1)
          for filename in [
              "program-compiler.js",
              "program-entry.js",
              "program-entry-adapter.js",
              "shared-setup.js",
              "app.js",
          ]:
              old = f'{filename}?v=186'
              new = f'{filename}?v=187'
              if old not in index and new not in index:
                  raise SystemExit(f"missing index revision for {filename}")
              index = index.replace(old, new)
          index_path.write_text(index)

          sw = sw_path.read_text()
          sw = sw.replace('const CACHE = "repforge-v186";', 'const CACHE = "repforge-v187";', 1)
          sw = sw.replace('"./", "./index.html", "./styles.css", "./styles-base.css", "./manifest.webmanifest",',
                          '"./", "./index.html", "./styles.css", "./motion-polish.css", "./manifest.webmanifest",', 1)
          sw = sw.replace('"/styles.css", "/styles-base.css",', '"/styles.css", "/motion-polish.css",', 1)
          for filename in [
              "program-compiler.js",
              "program-entry.js",
              "program-entry-adapter.js",
              "shared-setup.js",
              "app.js",
          ]:
              old = f'./{filename}?v=186'
              new = f'./{filename}?v=187'
              if old not in sw and new not in sw:
                  raise SystemExit(f"missing worker revision for {filename}")
              sw = sw.replace(old, new)
          sw_path.write_text(sw.rstrip("\n") + "\n")

          test = test_path.read_text()
          test = test.replace(
              'const motion = readFileSync(resolve(root, "styles.css"), "utf8");\n'
              'const base = readFileSync(resolve(root, "styles-base.css"), "utf8");\n'
              'const sw = readFileSync(resolve(root, "sw.js"), "utf8");',
              'const motion = readFileSync(resolve(root, "motion-polish.css"), "utf8");\n'
              'const base = readFileSync(resolve(root, "styles.css"), "utf8");\n'
              'const index = readFileSync(resolve(root, "index.html"), "utf8");\n'
              'const sw = readFileSync(resolve(root, "sw.js"), "utf8");',
              1,
          )
          test = test.replace(
              "assert(motion.startsWith('@import url(\"./styles-base.css\");'),\n"
              "  \"motion layer imports the preserved production stylesheet first\");\n"
              "assert(base.includes(\".ledger__row.is-fresh\") && base.includes(\".sumsheet.is-played\"),\n"
              "  \"preserved base stylesheet still owns the underlying production surfaces\");\n"
              "assert(sw.includes('\"./styles-base.css\"'),\n"
              "  \"the preserved base stylesheet is precached for offline launch\");",
              "assert(index.includes('<link rel=\"stylesheet\" href=\"styles.css\">') &&\n"
              "       index.includes('<link rel=\"stylesheet\" href=\"motion-polish.css\">'),\n"
              "  \"motion layer loads after the canonical production stylesheet\");\n"
              "assert(base.includes(\".ledger__row.is-fresh\") && base.includes(\".sumsheet.is-played\"),\n"
              "  \"canonical stylesheet still owns the underlying production surfaces\");\n"
              "assert(sw.includes('\"./motion-polish.css\"'),\n"
              "  \"motion stylesheet is precached for offline launch\");",
              1,
          )
          test_path.write_text(test)
          PY

      - name: Verify focused contracts before commit
        run: |
          node test/motion-polish.mjs
          node test/exercise-library.mjs
          node --check test/motion-polish.mjs

      - name: Commit normalized layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css motion-polish.css sw.js test/motion-polish.mjs styles-base.css
          git commit -m "Keep motion polish separate from canonical styles"
          git push origin HEAD:ui/emil-motion-polish
