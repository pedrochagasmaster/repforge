name: Simulation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install pinned test-only browser harness
        working-directory: test
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start static server
        run: python3 -m http.server 8000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Telemetry contracts
        run: |
          node test/telemetry-fixtures.mjs
          node test/telemetry-unit.mjs
          node test/posthog-adapter.mjs
          node test/posthog-config.mjs
          node test/telemetry-call-sites.mjs

      - name: Runtime event meaning
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/telemetry-runtime.mjs

      - name: Hostile-sentinel leakage and failure modes
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/telemetry-leakage.mjs

      - name: Regenerate UI evidence
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          # Copy the committed catalog somewhere immutable, regenerate it from
          # the app, then diff the two. The whole catalog is compared, not one
          # subtree: a screen that drifts must fail the build, not sit stale in
          # docs/ while CI stays green.
          baseline="$(mktemp -d)"
          cp -a docs/ui-screens/screens "$baseline/"
          cp -a docs/ui-screens/entry-semantics.json "$baseline/"
          chmod -R a-w "$baseline"
          cleanup() {
            chmod -R u+w -- "$baseline" 2>/dev/null || true
            rm -rf -- "$baseline"
          }
          trap cleanup EXIT
          node tools/capture-ui-screens.mjs
          node tools/check-ui-screens.mjs
          node tools/compare-ui-screens.mjs --baseline "$baseline/screens" --baseline-semantic "$baseline/entry-semantics.json"

      - name: Upload UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens-${{ github.sha }}
          path: docs/ui-screens/
          if-no-files-found: error
          retention-days: 14

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install pinned test-only browser harness
        working-directory: test
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Syntax check runtime and test JS
        run: |
          node tools/check-production-syntax.mjs
          for f in test/*.mjs test/generative/*/*.mjs tools/*.mjs tools/ui-screens/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Generative properties (fast-check)
        run: node test/generative/run.mjs --profile ci

      - name: Generate analytics-disabled preview config
        run: node scripts/generate-posthog-config.mjs

      - name: Plan 048 pure contracts
        run: |
          node test/program-entry.mjs
          node test/program-entry-production-adapter.mjs
          node test/program-compiler-plan048-preferences.mjs
          node test/pr201-contracts.mjs
          node test/ui-screens.mjs

      - name: Start static server
        run: python3 -m http.server 8000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          exit 1

      - name: Schedule tests
        run: node test/schedule.mjs

      - name: Production-backed entry properties
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/generative-entry-runtime.mjs

      - name: Two-page active-program conflict UX
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-entry-conflict-runtime.mjs

      - name: Installed service-worker upgrade
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/sw-upgrade.mjs

      - name: Resume rules-version drift
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-entry-rules-runtime.mjs

      - name: i18n parity
        run: node test/i18n.mjs

      - name: Exercise library integrity
        run: node test/exercise-library.mjs

      - name: Progression contracts and 52-week strategy simulations
        run: |
          node test/progression-fixtures.mjs
          node test/progression-engine.mjs
          node test/progression-range-simulation.mjs
          node test/progression-strategies-simulation.mjs

      - name: Program-family compiler contracts
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node tools/build-program-family-fixtures.mjs --check
          node test/program-family-fixtures.mjs
          node test/program-compiler-persistence.mjs
          node test/program-compiler-runtime.mjs

      - name: Plan 048 production browser entry
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-entry-browser.mjs

      - name: Persistence artifact helper self-test
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/persistence-artifacts.mjs --self-test

      - name: Persistence
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/persistence.mjs
          node test/persistence-race.mjs
          node test/thermonuclear-races.mjs

      - name: Notifications
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/notifications.mjs

      - name: Appearance and dark theme
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/appearance.mjs

      - name: Recovery gate
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/recover-gate.mjs

      - name: Install modes and first-run gate
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/install-modes.mjs

      - name: Accessibility
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/accessibility.mjs
          node test/accessibility.mjs --touch-targets-320

      - name: History
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/history.mjs

      - name: Today completed-session state
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/today-done.mjs

      - name: Today day picker
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/today-day-picker.mjs

      - name: Backing out of onboarding
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/onboarding-cancel.mjs

      - name: Focus mode
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/focus-mode.mjs

      - name: Progression recommendation parity and browser surfaces
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/recommendation-parity.mjs
          node test/progression-strategies-ui.mjs
          node test/progression-strategies-offline.mjs

      - name: Program editor interactions
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/program-editor-text-fields.mjs
          node test/program-editor-drag-selection.mjs

      - name: Plain-text program export
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-text-export.mjs

      - name: Exercise library focused flows
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/exercise-picker.mjs
          node test/library-flow.mjs
          node test/performed-attribution.mjs
          node test/program-import-review.mjs

      - name: Sheet swipe dismiss
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/sheet-swipe-dismiss.mjs

      - name: Session summary
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/session-summary.mjs

      - name: Workout draft guards
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/adversarial-draft-transactions.mjs
          node test/program-draft-conflicts.mjs
          node test/program-draft-set-reduction.mjs
          node test/program-draft-day-rename.mjs
          node test/workout-day-context-discard.mjs

      - name: Manual-matrix helper
        run: node test/manual-matrix.mjs --self-test

      - name: Full 52-week profiled simulation
        env:
          REPFORGE_URL: http://localhost:8000/
          REPFORGE_SIM_WEEKS: "52"
          REPFORGE_PROFILE: "1"
        run: node test/simulation.mjs
