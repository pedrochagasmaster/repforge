name: Simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the existing check name while running its contracts only once.
  interaction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - name: Reconcile the executable inventory
        run: node tools/run-tests.mjs --check
      - name: Fast contracts (no browser installation)
        run: node tools/run-tests.mjs fast
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [state, entry, workout]
    env:
      REPFORGE_URL: http://localhost:8000/
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install the pinned headless browser only
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Serve an analytics-disabled preview
        run: |
          node scripts/generate-posthog-config.mjs
          mkdir -p .ci-results
          python3 -m http.server 8000 >.ci-results/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run ${{ matrix.lane }} suites
        run: node tools/run-tests.mjs "${{ matrix.lane }}"
      - name: Upload timings, failure logs and diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.lane }}-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  telemetry-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPFORGE_URL: http://localhost:8000/
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install the pinned headless browser only
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Serve an analytics-disabled preview
        run: |
          node scripts/generate-posthog-config.mjs
          mkdir -p .ci-results
          python3 -m http.server 8000 >.ci-results/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Runtime event meaning and hostile-sentinel leakage
        run: node tools/run-tests.mjs privacy
      - name: Upload privacy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPFORGE_URL: http://localhost:8000/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Select visual scope before installing a browser
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci-selection.mjs
      - name: Install capture dependencies only when needed
        if: steps.scope.outputs.mode != 'none'
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Serve an analytics-disabled preview
        if: steps.scope.outputs.mode != 'none'
        run: |
          node scripts/generate-posthog-config.mjs
          python3 -m http.server 8000 >.ci-results/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Regenerate and compare visual and semantic evidence
        if: steps.scope.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)"
          cp -a docs/ui-screens/screens "$baseline/"
          cp -a docs/ui-screens/entry-semantics.json "$baseline/"
          chmod -R a-w "$baseline"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cp -a "$baseline" .ci-results/visual-baseline || true
            fi
            chmod -R u+w -- "$baseline" 2>/dev/null || true
            rm -rf -- "$baseline"
            exit "$status"
          }
          trap cleanup EXIT
          mapfile -d '' -t capture_args < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync(".ci-results/visual-plan.json", "utf8"));
            for (const key of plan.screens) process.stdout.write("--screen\0" + key + "\0");
          ')
          echo 'Capture started; catalog is not fresh until capture exits successfully.' >.ci-results/visual-status.txt
          node tools/capture-ui-screens.mjs "${capture_args[@]}" 2>&1 | tee .ci-results/capture.log
          echo 'Capture succeeded; checking registration and comparing pixels and semantics.' >.ci-results/visual-status.txt
          node tools/check-ui-screens.mjs 2>&1 | tee .ci-results/catalog.log
          node tools/compare-ui-screens.mjs --baseline "$baseline/screens" --baseline-semantic "$baseline/entry-semantics.json" 2>&1 | tee .ci-results/compare.log
          echo 'Capture, registration, perceptual comparison and semantics passed.' >.ci-results/visual-status.txt
      - name: Upload selection and visual logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ github.sha }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
      - name: Upload current catalog for a failed visual run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-current-${{ github.sha }}
          path: docs/ui-screens/
          retention-days: 7

  # Compatibility alias: the recorder's rejection tests are in the fast lane.
  verification-evidence:
    if: always()
    needs: interaction-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.interaction-runtime.result }}
        run: test "$RESULT" = success

  # Keep the old required check name; a failed, cancelled or missing lane fails it.
  simulation:
    if: always()
    needs: [interaction-runtime, browser, telemetry-privacy, visual-evidence, verification-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(needs)){console.log(`${name}: ${job.result}`); if(job.result!=="success")process.exitCode=1;}'
