name: Simulation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install pinned test-only browser harness
        working-directory: test
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Syntax check runtime and test JS
        run: |
          for f in app.js i18n.js notify.js schedule.js sw.js test/*.mjs test/generative/*/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Generative properties (fast-check)
        run: node test/generative/run.mjs --profile ci

      - name: Start static server
        run: python3 -m http.server 8000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          exit 1

      - name: Schedule tests
        run: node test/schedule.mjs

      - name: i18n parity
        run: node test/i18n.mjs

      - name: Exercise library integrity
        run: node test/exercise-library.mjs

      - name: Persistence artifact helper self-test
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/persistence-artifacts.mjs --self-test

      - name: Persistence
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/persistence.mjs
          node test/persistence-race.mjs
          node test/thermonuclear-races.mjs

      - name: Notifications
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/notifications.mjs

      - name: Appearance and dark theme
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/appearance.mjs

      - name: Recovery gate
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/recover-gate.mjs

      - name: Install modes and first-run gate
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/install-modes.mjs

      - name: Accessibility
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/accessibility.mjs
          node test/accessibility.mjs --touch-targets-320

      - name: History
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/history.mjs

      - name: Today completed-session state
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/today-done.mjs

      - name: Today day picker
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/today-day-picker.mjs

      - name: Focus mode
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/focus-mode.mjs

      - name: Program editor text fields
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-editor-text-fields.mjs

      - name: Plain-text program export
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/program-text-export.mjs

      - name: Exercise library focused flows
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/exercise-picker.mjs
          node test/library-flow.mjs
          node test/performed-attribution.mjs
          node test/program-import-review.mjs

      - name: Sheet swipe dismiss
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/sheet-swipe-dismiss.mjs

      - name: Session summary
        env:
          REPFORGE_URL: http://localhost:8000/
        run: node test/session-summary.mjs

      - name: Workout draft guards
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          node test/adversarial-draft-transactions.mjs
          node test/program-draft-conflicts.mjs
          node test/program-draft-set-reduction.mjs
          node test/program-draft-day-rename.mjs
          node test/workout-day-context-discard.mjs

      - name: Manual-matrix helper
        run: node test/manual-matrix.mjs --self-test

      - name: Full 52-week profiled simulation
        env:
          REPFORGE_URL: http://localhost:8000/
          REPFORGE_SIM_WEEKS: "52"
          REPFORGE_PROFILE: "1"
        run: node test/simulation.mjs
