name: Simulation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope
        type: choice
        required: true
        options: [feedback, candidate]
      expected_sha:
        description: Exact 40-character source SHA
        required: true

permissions:
  contents: read

concurrency:
  # A manually dispatched exact-SHA candidate supersedes the automatic draft
  # feedback run for the same branch instead of duplicating the whole matrix.
  group: simulation-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      head: ${{ steps.select.outputs.head }}
      browser: ${{ steps.select.outputs.browser }}
      fast: ${{ steps.select.outputs.fast }}
      service: ${{ steps.select.outputs.service }}
      visual: ${{ steps.select.outputs.visual }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Select commands and verify exact source SHA
        id: select
        run: node tools/ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ steps.select.outputs.head }}
          path: .ci-results/ci-plan.json
          retention-days: 14

  interaction-runtime:
    needs: plan
    if: needs.plan.outputs.fast != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_SOURCE_SHA: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ needs.plan.outputs.head }}
          path: .ci-results
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - run: node tools/run-tests.mjs --check
      - name: Selected fast contracts
        run: node tools/run-tests.mjs fast --suite-ids "${{ needs.plan.outputs.fast }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ needs.plan.outputs.head }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  browser:
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.browser) }}
    env:
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
      CI_SOURCE_SHA: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
          # Historical migration contracts use git show/archive on older commits.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ needs.plan.outputs.head }}
          path: .ci-results
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install pinned headless browser
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Run selected ${{ matrix.lane }} contracts
        env:
          LANE: ${{ matrix.lane }}
        run: |
          ids="$(node --input-type=module -e 'import{readFileSync}from"node:fs";const p=JSON.parse(readFileSync(".ci-results/ci-plan.json"));process.stdout.write(p.tests[process.env.LANE].join(","))')"
          node tools/run-tests.mjs "$LANE" --suite-ids "$ids" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.lane }}-${{ needs.plan.outputs.head }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  install-transfer-service:
    needs: plan
    if: needs.plan.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_SOURCE_SHA: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: services/install-transfer
      - run: node tools/run-tests.mjs service --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ needs.plan.outputs.head }}
          path: .ci-results/service/
          include-hidden-files: true
          retention-days: 7

  visual-evidence:
    needs: plan
    if: needs.plan.outputs.visual != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ needs.plan.outputs.head }}
          path: .ci-results
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned headless browser
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Recapture and compare pixels and semantics
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)"
          cp -a docs/ui-screens/screens "$baseline/"
          cp -a docs/ui-screens/entry-semantics.json "$baseline/"
          chmod -R a-w "$baseline"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cp -a "$baseline" .ci-results/visual-baseline || true; fi
            chmod -R u+w -- "$baseline" 2>/dev/null || true
            rm -rf -- "$baseline"
          }
          trap cleanup EXIT
          mapfile -d '' -t capture_args < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = JSON.parse(readFileSync(".ci-results/ci-plan.json"));
            if (p.visual.mode === "screens") for (const key of p.visual.screens)
              process.stdout.write("--screen\0" + key + "\0");
          ')
          node tools/capture-ui-screens.mjs "${capture_args[@]}" 2>&1 | tee .ci-results/capture.log
          node tools/check-ui-screens.mjs 2>&1 | tee .ci-results/catalog.log
          node tools/compare-ui-screens.mjs --baseline "$baseline/screens" --baseline-semantic "$baseline/entry-semantics.json" 2>&1 | tee .ci-results/compare.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ needs.plan.outputs.head }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  verification-evidence:
    if: always()
    needs: [plan, interaction-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.interaction-runtime.result }}
          FAST_SELECTED: ${{ needs.plan.outputs.fast }}
        run: test "$PLAN" = success && { test -z "$FAST_SELECTED" || test "$FAST" = success; }

  # Required check is emitted only for candidate mode. A feedback pass cannot satisfy it.
  simulation:
    if: always() && (needs.plan.outputs.mode == 'candidate' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' || github.event_name == 'pull_request' && !github.event.pull_request.draft)
    needs: [plan, interaction-runtime, browser, install-transfer-service, visual-evidence, verification-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Require selected candidate lanes to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import { requireSelectedCiResults } from "./tools/ci-plan.mjs"; requireSelectedCiResults(JSON.parse(process.env.RESULTS));'

  simulation-feedback:
    if: always() && (needs.plan.outputs.mode == 'feedback' || github.event_name == 'pull_request' && github.event.pull_request.draft || github.event_name == 'workflow_dispatch' && inputs.mode == 'feedback')
    needs: [plan, interaction-runtime, browser, install-transfer-service, visual-evidence, verification-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Require selected feedback lanes to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import { requireSelectedCiResults } from "./tools/ci-plan.mjs"; requireSelectedCiResults(JSON.parse(process.env.RESULTS));'
