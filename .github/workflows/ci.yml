# One workflow, two lanes, each behind its own aggregate check.
#  - "ci" (the PR lane): every pull request, push to main, nightly and manual
#    run executes the pull-request inventory (SUITES in test/suites.mjs); the
#    only shortcut is that a prose-only PR skips the test jobs.
#  - "ci-full" (the full lane): FULL_SUITES, the exhaustive catalog verify,
#    the role/contrast and Direction-D audits, the year-long simulation and the
#    retired dedicated permutations. Pushes to main, the nightly schedule and
#    manual runs execute all of it. A pull request runs only the full-lane
#    commands and catalog states its changed files can affect
#    (tools/test-selection.mjs), and only after its PR lane passed, so a red PR
#    lane never spends a full run and the two lanes do not compete for runners.
#    The merge gate is both checks green. A failure on main is a red check on
#    main (triage: docs/ci.md).
# Browser work is split across balanced shards (CI_SHARDS, and FULL_SHARDS or a
# targeted count from the plan); the account allows 20 concurrent jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or branch cancels that run's in-flight jobs in
# both lanes; runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pull requests test the reviewed head commit, not GitHub's synthetic merge
  # commit, so a red run reproduces locally with `git checkout <sha>` and the
  # generative seeds derived from this value are stable.
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      reason: ${{ steps.plan.outputs.reason }}
      shards: ${{ steps.plan.outputs.shards }}
      full_run: ${{ steps.plan.outputs.full_run }}
      full_fast: ${{ steps.plan.outputs.full_fast }}
      full_browser: ${{ steps.plan.outputs.full_browser }}
      full_shards: ${{ steps.plan.outputs.full_shards }}
      full_selection: ${{ steps.plan.outputs.full_selection }}
      capture_shards: ${{ steps.plan.outputs.capture_shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - id: plan
        run: node tools/ci-plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fast:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - run: node tools/run-tests.mjs --check
      - run: python3 -B plans/073/test_verify.py
      - run: node tools/run-tests.mjs fast --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  browser:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Full-history checkout can take 10 minutes. Keep time for the suites and artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
      REPFORGE_CI_CAPTURES_DIR: ${{ github.workspace }}/.ci-captures
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          # Keep the full commit graph for historical migration contract tests;
          # missing older file blobs are fetched on demand from this public repo.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      # The Chromium shell and the system packages it needs (fonts included, so
      # frames render exactly as the committed catalog) are cached: the Azure apt
      # mirror sometimes serves them at ~30 kB/s, which cost shards 10+ minutes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package-lock.json') }}-apt1
      - name: Install pinned test dependencies and the headless Chromium shell
        working-directory: test
        run: |
          npm ci
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99taurifer-keep-debs >/dev/null
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" >/dev/null; then sudo cp "$HOME"/.cache/playwright-apt/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps --only-shell chromium
          mkdir -p "$HOME/.cache/playwright-apt"
          cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/" 2>/dev/null || true
      - name: Run browser shard ${{ matrix.shard }}
        run: node tools/run-tests.mjs shard "${{ matrix.shard }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
      # Frames this run rendered differently from the committed catalog: node tools/fetch-ci-captures.mjs <run-id>.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-captures-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-captures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  service:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/install-transfer/package-lock.json
      - run: npm ci
        working-directory: services/install-transfer
      - run: node tools/run-tests.mjs service --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ github.run_attempt }}
          path: .ci-results/service/
          include-hidden-files: true
          retention-days: 7

  # The aggregate status check. It runs even after cancellation, so a cancelled
  # or unexpectedly skipped job cannot become a green/skipped required check.
  # It passes only when every selected job passed, and it applies the complete
  # declared critical UI contract that no single shard
  # can decide on its own.
  ci:
    needs: [plan, fast, browser, service]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual_only: ${{ steps.visual.outputs.visual_only }}
    steps:
      # Decided here, not by the checked-out planner: a branch cut before this
      # workflow carries an older tools/ci-plan.mjs that never emits `run`, so
      # every test job would be skipped and its gate script would still exit 0.
      - name: Require a run decision from the current planner
        env:
          RUN: ${{ needs.plan.outputs.run }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$RUN" != "true" ] && [ "$RUN" != "false" ]; then
            echo "::error::The plan job (${PLAN}) produced no run decision, so no tests ran. This branch predates the sharded CI: merge main into it so tools/ci-plan.mjs matches .github/workflows/ci.yml."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - if: needs.plan.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: .ci-results/shards
      # Before the gate can stop the job: a PR lane red only on critical frames starts the capture stripes.
      - id: visual
        if: needs.plan.outputs.run == 'true'
        name: Classify a visual-only failure
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs visual-only .ci-results/shards
      - name: Require every selected job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs gate
      - if: needs.plan.outputs.run == 'true'
        name: Validate the complete critical UI report
        run: node tools/ci-plan.mjs merge-ui-system .ci-results/shards

  # ------------------------------------------------------------ full lane
  # Staged behind the PR lane on pull requests (needs.ci); on main, nightly and
  # manual runs it follows the PR lane and runs whatever that lane's result.
  full-fast:
    needs: [plan, ci]
    if: ${{ !cancelled() && needs.plan.outputs.full_fast == 'true' && (github.event_name != 'pull_request' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPFORGE_FULL_SELECTION: ${{ needs.plan.outputs.full_selection }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - run: node tools/run-tests.mjs full-fast --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-fast-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14

  full-browser:
    needs: [plan, ci]
    if: ${{ !cancelled() && needs.plan.outputs.full_browser == 'true' && (github.event_name != 'pull_request' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.full_shards) }}
    env:
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
      REPFORGE_CI_CAPTURES_DIR: ${{ github.workspace }}/.ci-captures
      REPFORGE_FULL_SELECTION: ${{ needs.plan.outputs.full_selection }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          # Keep the full commit graph for historical migration contract tests;
          # missing older file blobs are fetched on demand from this public repo.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      # The Chromium shell and the system packages it needs (fonts included, so
      # frames render exactly as the committed catalog) are cached: the Azure apt
      # mirror sometimes serves them at ~30 kB/s, which cost shards 10+ minutes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package-lock.json') }}-apt1
      - name: Install pinned test dependencies and the headless Chromium shell
        working-directory: test
        run: |
          npm ci
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99taurifer-keep-debs >/dev/null
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" >/dev/null; then sudo cp "$HOME"/.cache/playwright-apt/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps --only-shell chromium
          mkdir -p "$HOME/.cache/playwright-apt"
          cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/" 2>/dev/null || true
      - name: Run full-lane browser shard ${{ matrix.shard }}
        run: node tools/run-tests.mjs full-shard "${{ matrix.shard }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-shard-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
      # Frames this run rendered differently from the committed catalog: node tools/fetch-ci-captures.mjs <run-id>.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-captures-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-captures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # A pull request whose PR lane is red only on critical frames (a visual change
  # waiting for its frames) runs the targeted verify stripes anyway, so CI
  # publishes every affected frame in one round. Both gates stay red until the
  # frames are committed.
  full-capture:
    needs: [plan, ci]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci.outputs.visual_only == 'true' && needs.plan.outputs.capture_shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.capture_shards) }}
    env:
      REPFORGE_CI_CAPTURES_DIR: ${{ github.workspace }}/.ci-captures
      REPFORGE_FULL_SELECTION: ${{ needs.plan.outputs.full_selection }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      # The Chromium shell and the system packages it needs (fonts included, so
      # frames render exactly as the committed catalog) are cached: the Azure apt
      # mirror sometimes serves them at ~30 kB/s, which cost shards 10+ minutes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package-lock.json') }}-apt1
      - name: Install pinned test dependencies and the headless Chromium shell
        working-directory: test
        run: |
          npm ci
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99taurifer-keep-debs >/dev/null
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" >/dev/null; then sudo cp "$HOME"/.cache/playwright-apt/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps --only-shell chromium
          mkdir -p "$HOME/.cache/playwright-apt"
          cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/" 2>/dev/null || true
      - name: Capture verify stripe ${{ matrix.shard }}
        run: node tools/run-tests.mjs full-verify "${{ matrix.shard }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-shard-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-captures-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-captures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The full lane's aggregate check, even if the run was cancelled.
  # Every job the plan selected
  # must pass (on a PR, after a passing PR lane), and the UI-system shard reports
  # merge under the selection's rule: the catalog-wide never-rendered rule for
  # the complete lane, exactly the selected states for a targeted one.
  ci-full:
    needs: [plan, ci, full-fast, full-browser, full-capture]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Require every selected full-lane job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: node tools/ci-plan.mjs gate-full
      - if: needs.plan.outputs.full_browser == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: full-shard-*
          path: .ci-results/full-shards
      - if: needs.plan.outputs.full_browser == 'true'
        name: Merge the full UI-system shard reports
        env:
          REPFORGE_FULL_SELECTION: ${{ needs.plan.outputs.full_selection }}
        run: node tools/ci-plan.mjs merge-ui-system-full .ci-results/full-shards
