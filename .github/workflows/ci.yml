# One workflow, two lanes, each behind its own aggregate check.
#  - "ci" (the PR lane): every pull request, push to main, nightly and manual
#    run executes the pull-request inventory (SUITES in test/suites.mjs); the
#    only shortcut is that a prose-only PR skips the test jobs.
#  - "ci-full" (the full lane): every push to main, nightly and manual run also
#    executes FULL_SUITES: the exhaustive catalog verify, the role/contrast and
#    Direction-D audits over every rendered state, the year-long simulation and
#    the retired dedicated permutations. It never runs on pull requests; a
#    failure is a red check on main (triage: docs/ci.md).
# Browser work is split across balanced shards (CI_SHARDS / FULL_SHARDS); the
# account allows 20 concurrent jobs, so overlapping runs queue some shards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull requests test the reviewed head commit, not GitHub's synthetic merge
  # commit, so a red run reproduces locally with `git checkout <sha>` and the
  # generative seeds derived from this value are stable.
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      reason: ${{ steps.plan.outputs.reason }}
      shards: ${{ steps.plan.outputs.shards }}
      full_shards: ${{ steps.plan.outputs.full_shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - id: plan
        run: node tools/ci-plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fast:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - run: node tools/run-tests.mjs --check
      - run: python3 -B plans/073/test_verify.py
      - run: node tools/run-tests.mjs fast --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  browser:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Full-history checkout can take 10 minutes. Keep time for the suites and artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Historical migration contracts read older commits with `git show`.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install pinned test dependencies and the headless Chromium shell
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Run browser shard ${{ matrix.shard }}
        run: node tools/run-tests.mjs shard "${{ matrix.shard }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7

  service:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/install-transfer/package-lock.json
      - run: npm ci
        working-directory: services/install-transfer
      - run: node tools/run-tests.mjs service --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ github.run_attempt }}
          path: .ci-results/service/
          include-hidden-files: true
          retention-days: 7

  # The aggregate status check. It passes only when every selected job
  # passed, and it applies the complete declared critical UI contract that no single shard
  # can decide on its own.
  ci:
    needs: [plan, fast, browser, service]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Decided here, not by the checked-out planner: a branch cut before this
      # workflow carries an older tools/ci-plan.mjs that never emits `run`, so
      # every test job would be skipped and its gate script would still exit 0.
      - name: Require a run decision from the current planner
        env:
          RUN: ${{ needs.plan.outputs.run }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$RUN" != "true" ] && [ "$RUN" != "false" ]; then
            echo "::error::The plan job (${PLAN}) produced no run decision, so no tests ran. This branch predates the sharded CI: merge main into it so tools/ci-plan.mjs matches .github/workflows/ci.yml."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Require every selected job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs gate
      - if: needs.plan.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: .ci-results/shards
      - if: needs.plan.outputs.run == 'true'
        name: Validate the complete critical UI report
        run: node tools/ci-plan.mjs merge-ui-system .ci-results/shards

  # ------------------------------------------------------------ full lane
  full-fast:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci --prefix test
      - run: node tools/run-tests.mjs full-fast --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-fast-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14

  full-browser:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.full_shards) }}
    env:
      REPFORGE_DIAGNOSTIC_REPLAY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Historical migration contracts read older commits with `git show`.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install pinned test dependencies and the headless Chromium shell
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Run full-lane browser shard ${{ matrix.shard }}
        run: node tools/run-tests.mjs full-shard "${{ matrix.shard }}" --keep-going
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-shard-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14

  # The full lane's aggregate check. Every full job must pass, and the
  # catalog-wide UI-system rule (every inventoried selector rendered somewhere)
  # is applied over all check-ui-system shard reports.
  ci-full:
    needs: [plan, full-fast, full-browser]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Require every full-lane job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs gate-full
      - uses: actions/download-artifact@v4
        with:
          pattern: full-shard-*
          path: .ci-results/full-shards
      - name: Merge the full UI-system shard reports
        run: node tools/ci-plan.mjs merge-ui-system-full .ci-results/full-shards
