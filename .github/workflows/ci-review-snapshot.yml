# Temporary bridge for one verified large-file edit; removed in the next revision.
# Creates an unattached blob only: it cannot move a branch or open/merge a PR.
name: CI review snapshot
on: pull_request
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.number == 236 && github.event.pull_request.head.repo.full_name == 'pedrochagasmaster/repforge' && github.event.pull_request.head.ref == 'codex/ci-simplification'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply exact reviewed test-only edit to an unattached blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          path = pathlib.Path('test/shared-setup-flow.mjs')
          original = path.read_bytes()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(original) == '800a26b1db7a597951994ccc936dea689a8bbe2f'
          text = original.decode()
          edits = [
            ('      review: document.querySelector(".entry__review-grid")?.textContent || "",', '      review: document.querySelector("#onbBody")?.innerText || "",'),
            (r'      rendered.days.every((day) => /about \d+ minutes|cerca de \d+ minutos/.test(day)),', r'      rendered.days.length === expected.length && rendered.days.every((day) => /about \d+ minutes|cerca de \d+ minutos/.test(day)),'),
            ('    await page.waitForFunction(() => !document.querySelector("#onboarding")?.classList.contains("active"), null, { timeout: 10000 }).catch(() => {});', '    await page.waitForFunction(() => !document.querySelector("#onboarding")?.classList.contains("active"), null, { timeout: 10000 });'),
            ('      if (!(await clickSharedStart(page).catch(() => false))) {\n        await context.close();\n        continue;\n      }\n      await page.waitForTimeout(500);\n      const after = await readBothReplicas(page);', '      if (!(await clickSharedStart(page, { activate: false }))) {\n        await context.close();\n        continue;\n      }\n      await page.click("#entryActivate");\n      await page.locator("#entryDurableConflictReview, #entryConflictReview").first()\n        .waitFor({ state: "visible", timeout: 10000 });\n      const after = await readBothReplicas(page);'),
          ]
          for before, after in edits:
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          assert blob(text.encode()) == '2982a521d5751659c481c0846e04ae4ee6f1b40e'
          path.write_text(text)
          subprocess.run(['node', '--check', str(path)], check=True)
          request = urllib.request.Request(
              'https://api.github.com/repos/pedrochagasmaster/repforge/git/blobs',
              data=json.dumps({'content': text, 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == '2982a521d5751659c481c0846e04ae4ee6f1b40e', result
          print('Verified unattached test blob:', result['sha'])
          PY
