# Temporary focused validation and unattached-blob bridge; removed before final review.
name: CI review snapshot
on: pull_request
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.number == 236 && github.event.pull_request.head.repo.full_name == 'pedrochagasmaster/repforge' && github.event.pull_request.head.ref == 'codex/ci-simplification'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Apply exact reviewed synchronization fix
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          path=pathlib.Path('test/program-draft-day-rename.mjs')
          original=path.read_bytes()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob(original)=='f1e8475ee1bb4288e17bb9a25b068c32fc136368'
          before='    const workoutResult = await workout.evaluate(() => window.__renameRaceWorkoutResult);\n'
          after=before+'''    // Done dispatches an asynchronous editor commit without returning its promise.
              // flush() only snapshots the current persistence tail; the editor can enqueue
              // its rename later. Wait for the real successful-commit UI before reading it.
              await renamer.waitForFunction(
                () => document.querySelector("#programEditorWrap")?.classList.contains("is-hidden"),
                undefined,
                { timeout: 10000 }
              );
          '''
          # Match the test's four-space block indentation after YAML strips its own prefix.
          after=before+'    // Done dispatches an asynchronous editor commit without returning its promise.\n    // flush() only snapshots the current persistence tail; the editor can enqueue\n    // its rename later. Wait for the real successful-commit UI before reading it.\n    await renamer.waitForFunction(\n      () => document.querySelector("#programEditorWrap")?.classList.contains("is-hidden"),\n      undefined,\n      { timeout: 10000 }\n    );\n'
          text=original.decode()
          assert text.count(before)==2
          text=text.replace(before,after)
          assert blob(text.encode())=='8dfb6d19f89202e1fe794a0f070d361703e73882'
          path.write_text(text)
          subprocess.run(['node','--check',str(path)],check=True)
          PY
      - name: Install pinned browser
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Exercise the full race suite ten times without retries
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          set -euo pipefail
          node scripts/generate-posthog-config.mjs
          mkdir -p .ci-results/race-stress
          python3 -m http.server 8000 >.ci-results/race-stress/server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          for attempt in $(seq 1 10); do
            echo "Independent full-suite repetition $attempt of 10"
            timeout 90s node test/program-draft-day-rename.mjs 2>&1 | tee ".ci-results/race-stress/run-$attempt.log"
          done
      - name: Publish verified unattached test blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          data=pathlib.Path('test/program-draft-day-rename.mjs').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert sha=='8dfb6d19f89202e1fe794a0f070d361703e73882'
          req=urllib.request.Request('https://api.github.com/repos/pedrochagasmaster/repforge/git/blobs',
              data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)
          assert result['sha']==sha,result
          print('Verified unattached test blob:',sha)
          PY
      - name: Retain independent repetition logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-rename-focused-validation
          path: .ci-results/race-stress/
          include-hidden-files: true
          retention-days: 7
