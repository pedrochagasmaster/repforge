# Temporary focused validation and unattached-blob bridge; removed before final review.
name: CI review snapshot
on: pull_request
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.number == 236 && github.event.pull_request.head.repo.full_name == 'pedrochagasmaster/repforge' && github.event.pull_request.head.ref == 'codex/ci-simplification'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Apply exact reviewed transaction-boundary fix
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          path=pathlib.Path('test/program-draft-day-rename.mjs')
          original=path.read_bytes()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob(original)=='f1e8475ee1bb4288e17bb9a25b068c32fc136368'
          text=original.decode()
          def replace(before,after,count=1,limit=-1):
              global text
              assert text.count(before)==count,before
              text=text.replace(before,after,limit)
          before='    const workoutResult = await workout.evaluate(() => window.__renameRaceWorkoutResult);\n'
          replace(before,before+'    // Done dispatches an asynchronous editor commit without returning its promise.\n    // flush() only snapshots the current persistence tail; the editor can enqueue\n    // its rename later. Wait for the real successful-commit UI before reading it.\n    await renamer.waitForFunction(\n      () => document.querySelector("#programEditorWrap")?.classList.contains("is-hidden"),\n      undefined,\n      { timeout: 10000 }\n    );\n',2)
          for value in ['107.5','110']:
              before=f'    await fillRaceWorkout(workout, {value});\n'
              replace(before,before+'    // Complete fixture input/suggestion writes before imposing the two-transaction race.\n    await workout.evaluate(() => window.__repforgeWorkoutDraft.flush());\n')
          before='    await workout.evaluate(() => {\n      window.__renameRaceWorkoutResult = window.__repforgeSaveWorkout();\n    });\n'
          after='    // This scenario orders two durable transactions. Hold the save\'s later UI\n    // work so it cannot create a third, successor draft while rename is queued.\n    // Successor-draft races are covered separately in workout-draft-storage.mjs.\n    await workout.evaluate(() => {\n      const afterSave = new Promise((resolve) => { window.__renameRaceResumeAfterSave = resolve; });\n      window.__repforgeDraftAfterSaveCommit = async () => {\n        delete window.__repforgeDraftAfterSaveCommit;\n        window.__renameRaceSaveCommitted = true;\n        await afterSave;\n      };\n      window.__renameRaceWorkoutResult = window.__repforgeSaveWorkout();\n    });\n'
          replace(before,after,2,1)
          before='    const workoutResult = await workout.evaluate(() => window.__renameRaceWorkoutResult);\n    // Done dispatches an asynchronous editor commit without returning its promise.\n'
          after='    await workout.waitForFunction(() => window.__renameRaceSaveCommitted === true, undefined, { timeout: 10000 });\n    // Done dispatches an asynchronous editor commit without returning its promise.\n'
          replace(before,after,2,1)
          before='    await Promise.all([\n      workout.evaluate(() => window.__repforgeStorage.flush()),\n      renamer.evaluate(() => window.__repforgeStorage.flush()),\n    ]);\n'
          replace(before,'    await workout.evaluate(() => window.__renameRaceResumeAfterSave());\n    const workoutResult = await workout.evaluate(() => window.__renameRaceWorkoutResult);\n'+before,2,1)
          assert blob(text.encode())=='9de7965315811c35512c928ca74f3a4fdcad6717'
          path.write_text(text)
          subprocess.run(['node','--check',str(path)],check=True)
          PY
      - name: Install pinned browser
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Exercise the full race suite ten times without retries
        env:
          REPFORGE_URL: http://localhost:8000/
        run: |
          set -euo pipefail
          node scripts/generate-posthog-config.mjs
          mkdir -p .ci-results/race-stress
          python3 -m http.server 8000 >.ci-results/race-stress/server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          for attempt in $(seq 1 10); do
            echo "Independent full-suite repetition $attempt of 10"
            timeout 90s node test/program-draft-day-rename.mjs 2>&1 | tee ".ci-results/race-stress/run-$attempt.log"
          done
      - name: Publish verified unattached test blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          data=pathlib.Path('test/program-draft-day-rename.mjs').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert sha=='9de7965315811c35512c928ca74f3a4fdcad6717'
          req=urllib.request.Request('https://api.github.com/repos/pedrochagasmaster/repforge/git/blobs',
              data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)
          assert result['sha']==sha,result
          print('Verified unattached test blob:',sha)
          PY
      - name: Retain independent repetition logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-rename-focused-validation
          path: .ci-results/race-stress/
          include-hidden-files: true
          retention-days: 7
